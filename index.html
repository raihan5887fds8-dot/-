<style>
:root{
  --bg:#F7F3EA;
  --card:#FFFDF6;
  --ink:#0B3D3B;
  --ink-deep:#082B29;
  --brass:#BB6B3A;
  --brass-soft:#EFD3B4;
  --rule:#DED4BC;
  --sage:#4F7942;
  --sage-soft:#E3EEDD;
  --terracotta:#B1502F;
  --terracotta-soft:#F3E1D8;
  --text:#2B2A22;
  --muted:#847E6C;
}
html[data-theme="dark"]{
  --bg:#12181A;
  --card:#1E2628;
  --rule:#333F42;
  --text:#E8E4D8;
  --muted:#9BA3A0;
  --brass-soft:#EFD3B4;
  --sage-soft:#22332A;
  --terracotta-soft:#3A2620;
}
html[data-theme="dark"] body{ background:var(--bg); }
html[data-theme="dark"] input[type=text],html[data-theme="dark"] input[type=number],html[data-theme="dark"] input[type=date],html[data-theme="dark"] input[type=tel],html[data-theme="dark"] input[type=password],html[data-theme="dark"] select,html[data-theme="dark"] textarea{
  background:#141A1C; color:var(--text); border-color:var(--rule);
}
html[data-theme="dark"] .list-item{ background:transparent; }
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Hind Siliguri',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:74px;}

/* ---------- header ---------- */
header{
  background:linear-gradient(155deg,var(--ink-deep),var(--ink) 75%);
  color:#F3EFE1;
  padding:20px 18px 16px;
  position:relative;
  overflow:hidden;
}
header::before{
  content:"";
  position:absolute;inset:0;
  background-image: radial-gradient(circle at 85% 0%, rgba(187,107,58,.22) 0, transparent 45%);
  pointer-events:none;
}
.header-row{display:flex;align-items:center;gap:12px;position:relative;}
.seal{
  flex:none;width:46px;height:46px;border-radius:50%;
  border:2px solid var(--brass-soft);
  display:flex;align-items:center;justify-content:center;
  font-family:'Baloo Da 2',sans-serif;font-weight:700;font-size:15px;
  color:var(--brass-soft);
  background:rgba(0,0,0,.15);
  letter-spacing:.5px;
}
.header-title h1{
  font-family:'Baloo Da 2',sans-serif;
  font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;
}
.header-title p{margin:2px 0 0;font-size:11.5px;color:var(--brass-soft);font-family:'Hind Siliguri',sans-serif;}
.header-user{
  margin-top:12px;display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:8px 10px;font-size:12.5px;
}
.role-pill{
  font-size:10.5px;padding:2px 8px;border-radius:8px;background:var(--brass);color:#2B1B0F;font-weight:700;
}
.logout-link{background:none;border:none;color:#E9DFCB;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;font-family:'Hind Siliguri',sans-serif;}

main{padding:16px 14px 24px;}
.card{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:4px solid var(--brass);
  border-radius:8px;
  padding:15px 15px 13px;
  margin-bottom:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.card h2{font-family:'Baloo Da 2',sans-serif;font-size:16.5px;margin:0 0 10px;color:var(--ink);}
.card h2 small{font-family:'Hind Siliguri',sans-serif;font-weight:500;color:var(--muted);font-size:11.5px;}

label{display:block;font-size:12.5px;color:var(--muted);margin:9px 0 4px;}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=password],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;
  background:#fff;font-family:'Hind Siliguri',sans-serif;font-size:14px;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.check-row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;color:var(--text);}
.check-row input{width:auto;}

.btn{

  font-family:'Hind Siliguri',sans-serif;
}
.btn:hover{background:var(--ink-deep);}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--text);}
.btn.danger{background:var(--terracotta);}
.btn.gold{background:var(--brass);color:#2B1B0F;}
.btn.small{padding:6px 11px;font-size:12px;margin-top:0;}
.btn.full{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.list-item{padding:11px 0;border-bottom:1px dashed var(--rule);}

.li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.li-name{font-weight:600;font-size:14px;}
.li-meta{font-size:11.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}
.amt{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14.5px;}
.amt.pos{color:var(--sage);}
.amt.neg{color:var(--terracotta);}

.badge{font-size:10.5px;padding:2px 8px;border-radius:8px;white-space:nowrap;font-weight:600;}
.badge.pending{background:var(--terracotta-soft);color:var(--terracotta);}
.badge.verified{background:var(--sage-soft);color:var(--sage);}
.badge.approved{background:var(--sage-soft);color:var(--sage);}
.badge.rejected{background:var(--terracotta-soft);color:var(--terracotta);}
.badge.running{background:var(--brass-soft);color:#6B4322;}
.badge.closed{background:#E7E3D6;color:var(--muted);}
.stamp{

.summary-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.summary-chip{flex:1 1 30%;min-width:90px;text-align:center;padding:10px 5px;border-radius:8px;background:#fff;border:1px solid var(--rule);}
.summary-chip .lbl{font-size:10.5px;color:var(--muted);}
.summary-chip .val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;color:var(--ink);}

.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px 0;}
.notice-card{border-left:4px solid var(--sage);}
.notice-card.urgent{border-left:4px solid var(--terracotta);}
.notice-card.urgent h3::before{content:"⚠️ ";}
.notice-card h3{margin:0 0 4px;font-family:'Baloo Da 2',sans-serif;font-size:14.5px;color:var(--ink);}
.notice-card p{margin:0;font-size:13px;line-height:1.5;}

.poll-options{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.poll-opt{
  border:1px solid var(--rule);border-radius:6px;padding:9px 11px;cursor:pointer;font-size:13.5px;
  display:flex;justify-content:space-between;background:#fff;
}
.poll-opt:hover{border-color:var(--brass);}
.poll-opt .bar{height:5px;border-radius:3px;background:var(--sage-soft);margin-top:6px;overflow:hidden;}
.poll-opt .bar i{display:block;height:100%;background:var(--sage);}

.status-msg{margin-top:8px;font-size:12.5px;}
.status-msg.ok{color:var(--sage);}
.status-msg.err{color:var(--terracotta);}

.auth-wrap{padding:34px 20px;}
.auth-brand{text-align:center;margin-bottom:22px;}
.auth-brand .seal{margin:0 auto 10px;width:58px;height:58px;font-size:19px;border-color:var(--brass);color:var(--ink);background:var(--brass-soft);}
.auth-brand h1{font-family:'Baloo Da 2',sans-serif;color:var(--ink);font-size:21px;margin:0;}
.auth-brand p{color:var(--muted);font-size:12.5px;margin:4px 0 0;}
.auth-toggle{display:flex;background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.auth-toggle button{flex:1;border:none;background:none;padding:11px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;font-family:'Hind Siliguri',sans-serif;}
.auth-toggle button.active{background:var(--ink);color:#fff;}

.progress-track{height:6px;border-radius:4px;background:var(--terracotta-soft);margin-top:8px;overflow:hidden;}
.progress-fill{height:100%;background:var(--sage);border-radius:4px;transition:width .3s;}

.banner{background:var(--brass-soft);border:1px solid var(--brass);border-radius:8px;padding:12px;font-size:13px;color:#5C3B1E;margin-bottom:14px;}
.principle-box{background:var(--sage-soft);border:1px solid var(--sage);border-radius:8px;padding:12px 13px;font-size:12.5px;line-height:1.6;color:#2E4A22;margin-bottom:14px;}

/* ---------- bottom tab bar ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;
  max-width:480px;margin:0 auto;
  display:flex;background:var(--ink-deep);
  box-shadow:0 -2px 10px rgba(0,0,0,.18);
  z-index:30;
}
nav.tabs button{
  flex:1;background:none;border:none;color:rgba(243,239,225,.5);

  padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;
  position:relative;
}
nav.tabs button .ic{font-size:16px;}
nav.tabs button.active{color:var(--brass-soft);}
.tab-badge{
  position:absolute;top:3px;right:calc(50% - 22px);
  background:#c0392b;color:#fff;font-size:9.5px;font-weight:700;
  min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  padding:0 3px;line-height:1;
}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
  background:var(--ink-deep);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:88%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

::-webkit-scrollbar{width:0;height:0;}
</style>

<script>
/* =========================================================================

const ORG_NAME = 'বন্ধু ঐক্য সমবায় সমিতি';
const TAGLINE = 'একতা, সমৃদ্ধি ও সুদমুক্ত সমবায় ব্যবস্থা';

/* ---------- storage abstraction: works inside Claude artifact preview or standalone ---------- */
const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');
async function localGet(key, fallback){
  try{
    if(hasClaudeStorage){
      const r = await window.storage.get('bes:'+key, false);
      return r ? JSON.parse(r.value) : fallback;
    } else {
      const v = localStorage.getItem('bes_'+key);
      return v ? JSON.parse(v) : fallback;
    }
  }catch(e){ return fallback; }
}
async function localSet(key, value){
  try{
    if(hasClaudeStorage){ await window.storage.set('bes:'+key, JSON.stringify(value), false); }
    else{ localStorage.setItem('bes_'+key, JSON.stringify(value)); }
  }catch(e){}
}

async function saveSession(user){ await localSet('session', user); session = user; }
async function clearSession(){ stopRealtimeSync(); await localSet('session', null); session = null; try{ await fbAuth.signOut(); }catch(e){} }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

/* সাধারণ alert()-এ ক্লিকযোগ্য লিংক দেওয়া যায় না, তাই এই ছোট মডালটা ব্যবহার করা হয় */
function showInfoModal(title, bodyHtml){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:14px;max-width:420px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,0.35);">
      <h3 style="margin:0 0 12px;font-size:16px;color:#0f4c3a;">${title}</h3>
      <div style="font-size:13.5px;line-height:1.8;color:#333;">${bodyHtml}</div>
      <button id="closeInfoModal" style="margin-top:18px;width:100%;padding:11px;border:none;border-radius:9px;background:#0f4c3a;color:#fff;font-size:14px;cursor:pointer;">বুঝেছি, বন্ধ করুন</button>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#closeInfoModal').addEventListener('click', ()=> overlay.remove());
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
}

function showNetBalanceHistoryModal_(){
  const myId = session['ID'];
  const myContribTotal = cache.contrib.filter(c=>String(c['সদস্য_ID'])===String(myId) && c['স্ট্যাটাস']==='ভেরিফাইড').reduce((s,c)=>s+Number(c['পরিমাণ']||0),0);
  const myDividendsChrono = cache.dividend.filter(d=>String(d['সদস্য_ID'])===String(myId)).sort((a,b)=>String(a['তারিখ']).localeCompare(String(b['তারিখ'])));
  let running = myContribTotal;
  const rowsArr = [`<tr><td>মোট চাঁদা (ভিত্তি)</td><td style="text-align:right;font-weight:700;">৳${money(myContribTotal)}</td></tr>`];
  myDividendsChrono.forEach(d=>{
    const amt = Number(d['পরিমাণ']||0);
    const isSettledElsewhere = d['ব্যবস্থা']==='রি-ইনভেস্ট_সম্পন্ন' || d['ব্যবস্থা']==='উত্তোলিত';
    if(!isSettledElsewhere) running += amt; // রি-ইনভেস্ট/উত্তোলন সম্পন্ন হয়ে গেলে সেটা আর এখানে গোনা হবে না, দ্বৈত-গণনা এড়াতে
    let actionHtml = '';
    if(amt > 0){
      if(!d['ব্যবস্থা']){
        actionHtml = `<div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn small" data-reinvest="${d['ID']}">রি-ইনভেস্ট করুন</button>
          <button class="btn small danger" data-withdraw="${d['ID']}">উত্তোলন করুন</button>

function showDistributionModal_(iv){
  const dist = iv['বণ্টন'] || {};
  const pl = Number(iv['লাভ_ক্ষতি']||0);
  const ids = Object.keys(dist);
  const excludedIds = Array.isArray(iv['বাদ_পড়া_সদস্য']) ? iv['বাদ_পড়া_সদস্য'] : [];
  let rowsHtml = '';
  if(!ids.length){
    rowsHtml = '<tr><td colspan="3" style="text-align:center;color:#888;">এই ইনভেস্টমেন্টের জন্য বণ্টন হিসাব করা হয়নি (পুরনো এন্ট্রি)</td></tr>';
  } else {
    ids.sort((a,b)=> (dist[b]['শতাংশ']||0) - (dist[a]['শতাংশ']||0));
    rowsHtml = ids.map(id=>{
      const d = dist[id];

        <td style="text-align:right;color:${share>=0?'#2e7d5b':'#b3402a'};font-weight:600;">৳${money(share)}</td>
      </tr>`;
    }).join('');
  }
  const excludedNames = excludedIds.map(id=>{
    const u = cache.users.find(x=>String(x['ID'])===String(id));
    return u ? u['নাম'] : id;
  });
  showInfoModal('% লাভ/ক্ষতি বণ্টন — '+iv['শিরোনাম'], `
    <p style="margin:0 0 8px;">মোট লাভ/ক্ষতি: <b style="color:${pl>=0?'#2e7d5b':'#b3402a'};">৳${money(pl)}</b></p>

      <tr style="background:#f0ece0;"><th style="text-align:left;padding:6px;">সদস্য</th><th style="text-align:right;padding:6px;">শতাংশ</th><th style="text-align:right;padding:6px;">ভাগ (৳)</th></tr>
      ${rowsHtml}
    </table>
    ${excludedNames.length? `<p style="margin-top:10px;font-size:12px;color:#888;">বাদ দেওয়া হয়েছে: ${excludedNames.join(', ')}</p>` : ''}
    <p style="margin-top:10px;font-size:11.5px;color:#888;">* শতাংশ ইনভেস্টমেন্ট তৈরির সময়কার চাঁদার অনুপাত অনুযায়ী স্থায়ীভাবে নির্ধারিত; টাকার ভাগ বর্তমান মোট লাভ/ক্ষতি অনুযায়ী পরিবর্তিত হতে থাকে।</p>
  `);
}

async function logActivity_(action, extra, message){
  try{
    let label = ACTION_LABEL[action] || action;
    if(extra) label += ' — ' + extra;
    await fbDb.ref(SHEETS.ACTIVITY_LOG).push({
      'কর্তা': session ? session['নাম'] : 'অজানা',
      'রোল': session ? session['রোল'] : '',
      'কাজ': label,
      'বিস্তারিত': message || '',
      'তারিখ': Date.now()
    });
  }catch(e){ /* লগ ব্যর্থ হলেও মূল কাজ যেন আটকে না যায় */ }
}

/* ---------- Firebase-ভিত্তিক জেনেরিক CRUD হেল্পার ---------- */
async function fbAdd_(sheetName, obj){
  const ref = fbDb.ref(sheetName).push();
  const id = ref.key;
  await ref.set(Object.assign({}, obj, {ID:id}));
  return id;
}
async function fbUpdate_(sheetName, id, patch){
  await fbDb.ref(sheetName+'/'+id).update(patch);
}
async function fbGetAll_(sheetName){
  const snap = await fbDb.ref(sheetName).get();
  const val = snap.val();
  if(!val) return [];
  return Object.keys(val).map(k=>{
    const obj = Object.assign({}, val[k]);
    obj.ID = k; // প্রতিটা রেকর্ডের আসল Firebase key-ই সবসময় ID হিসেবে ব্যবহৃত হবে
    return obj;
  });
}
async function touchRowTimestamp_(sheetName, id){
  if(!id) return;
  try{ await fbUpdate_(sheetName, id, {'সর্বশেষ_আপডেট': Date.now()}); }catch(e){}
}

/* ---------- API (Firebase সংস্করণ, আগের fetch()-ভিত্তিক apiGet/apiPost-এর সমতুল্য) ---------- */
async function apiGet(sheet){
  try{ return await fbGetAll_(sheet); }
  catch(e){ throw new Error('ডাটা আনতে ব্যর্থ: ' + e.message); }
}
async function apiPost(action, opts){
  opts = opts || {};
  const actorRole = session ? session['রোল'] : null;
  const data = opts.data || {};
  const id = opts.id;
  let result;
  switch(action){
    case 'approveUser':        result = await setUserStatus_(id, 'অনুমোদিত', actorRole); break;
    case 'rejectUser':         result = await setUserStatus_(id, 'বাতিল', actorRole); break;
    case 'changeRole':         result = await changeUserRole_(id, data['রোল'], actorRole); break;
    case 'submitContribution': result = await submitContribution_(data); break;
    case 'verifyContribution': result = await verifyContribution_(id, data['যাচাইকারী'], actorRole); break;
    case 'rejectContribution': result = await rejectContribution_(id, data['যাচাইকারী'], actorRole); break;
    case 'vote':                result = await castVote_(data); break;
    case 'closePoll':           result = await closePoll_(id, actorRole); break;
    case 'add':                  result = await addRow_(opts.sheet, data, actorRole); break;
    case 'addInvestment':        result = await addInvestment_(data, actorRole); break;
    case 'verifyInvestment':     result = await verifyInvestment_(id, actorRole); break;
    case 'rejectInvestment':     result = await rejectInvestment_(id, data['কারণ'], actorRole); break;
    case 'addInstallment':       result = await addInstallment_(data, actorRole); break;
    case 'edit':                 result = await editRow_(opts.sheet, id, data, actorRole); break;
    case 'delete':                result = await deleteRow_(opts.sheet, id, actorRole); break;
    case 'uploadImage':          result = await uploadInvestmentImage_(data, actorRole); break;
    case 'submitTransaction':    result = await submitTransaction_(data, actorRole); break;
    case 'verifyTransaction':    result = await verifyTransaction_(id, data['যাচাইকারী'], actorRole); break;
    case 'rejectTransaction':    result = await rejectTransaction_(id, data['যাচাইকারী'], data['বাতিলের_কারণ'], actorRole); break;
    case 'reviseTransaction':    result = await reviseTransaction_(id, data, actorRole); break;
    case 'deleteTransaction':    result = await deleteTransaction_(id, actorRole); break;
    case 'distributeDividend':   result = await distributeDividend_(id, actorRole); break;
    case 'requestDividendReinvest': result = await requestDividendReinvest_(id, actorRole); break;
    case 'requestDividendWithdraw':  result = await requestDividendWithdraw_(id, actorRole); break;
    case 'approveWithdrawal':    result = await approveWithdrawal_(id, actorRole); break;
    case 'rejectWithdrawal':     result = await rejectWithdrawal_(id, actorRole); break;
    default: throw new Error('অজানা action: ' + action);
  }
  if(!result || result.status !== 'ok') throw new Error((result && result.message) || 'অজানা সমস্যা');
  if(action !== 'uploadImage'){
    const extra = (action==='add'||action==='edit'||action==='delete') ? (opts.sheet||'') : '';
    logActivity_(action, extra, result.message);
  }
  return result;
}

async function refreshAll(){
  const sheets = ['ইউজার','চাঁদা','ইনভেস্টমেন্ট','ইনভেস্টমেন্ট_আপডেট','ইনভেস্টমেন্ট_কিস্তি','আদাল','বাচ্চা','বাচ্চা_আপডেট','খরচ','নোটিশ','ভোট','ভোট_ফলাফল','লেনদেন', SHEETS.RESET_REQ, SHEETS.ACTIVITY_LOG, SHEETS.DIVIDEND, SHEETS.WITHDRAWAL, SHEETS.RULES];
  const keys = ['users','contrib','invest','investUpdate','investInstallment','custodians','babies','babyUpdate','expense','notice','poll','votes','transaction','resetReq','activityLog','dividend','withdrawal','rules'];
  const results = await Promise.allSettled(sheets.map(apiGet));
  results.forEach((r,i)=>{ if(r.status==='fulfilled') cache[keys[i]] = r.value; });
}

/* =========================================================================
   নিচের ফাংশনগুলো আগের Google Apps Script (code.gs)-এর বিজনেস লজিক হুবহু
   JavaScript + Firebase Realtime Database-এ পোর্ট করা হয়েছে
   ========================================================================= */

function requireManager_(actorRole){ return actorRole === ROLES.MANAGER; }

async function setUserStatus_(id, status, actorRole){
  if(!requireManager_(actorRole)) return {status:'error', message:'শুধু ম্যানেজার এই কাজ করতে পারবেন'};
  await fbUpdate_(SHEETS.USERS, id, {'স্ট্যাটাস': status});
  return {status:'ok', message:'স্ট্যাটাস আপডেট হয়েছে'};
}

async function changeUserRole_(id, role, actorRole){
  if(!requireManager_(actorRole)) return {status:'error', message:'শুধু ম্যানেজার এই কাজ করতে পারবেন'};
  if([ROLES.MANAGER, ROLES.CASHIER, ROLES.FIELD, ROLES.MEMBER].indexOf(role) === -1) return {status:'error', message:'অবৈধ রোল'};
  await fbUpdate_(SHEETS.USERS, id, {'রোল': role});
  return {status:'ok', message:'রোল পরিবর্তন হয়েছে'};
}

/* ---------------- চাঁদা ---------------- */
async function submitContribution_(data){
  data = data || {};
  const required = ['সদস্য_ID','সদস্যের_নাম','মাস','পরিমাণ'];
  for(const k of required){ if(!data[k] && data[k] !== 0) return {status:'error', message:'সব তথ্য পূরণ করুন'}; }
  const id = await fbAdd_(SHEETS.CONTRIB, {
    'সদস্য_ID': data['সদস্য_ID'], 'সদস্যের_নাম': data['সদস্যের_নাম'], 'মাস': data['মাস'], 'পরিমাণ': data['পরিমাণ'],
    'মাধ্যম': data['মাধ্যম']||'', 'ট্রানজেকশন_আইডি': data['ট্রানজেকশন_আইডি']||'', 'স্ট্যাটাস':'পেন্ডিং',

/* ---------------- ভোট ---------------- */
async function castVote_(data){
  data = data || {};
  const pollId = data['ভোট_ID'], memberId = data['সদস্য_ID'], choice = data['বাছাই'];
  if(!pollId || !memberId || !choice) return {status:'error', message:'সব তথ্য দরকার'};
  const pollSnap = await fbDb.ref(SHEETS.POLL+'/'+pollId).get();
  if(!pollSnap.exists()) return {status:'error', message:'ভোট পাওয়া যায়নি'};
  if(pollSnap.val()['স্ট্যাটাস'] !== 'চলমান') return {status:'error', message:'এই ভোট এখন বন্ধ আছে'};
  const votes = await fbGetAll_(SHEETS.VOTES);
  if(votes.some(v => String(v['ভোট_ID'])===String(pollId) && String(v['সদস্য_ID'])===String(memberId))){
    return {status:'error', message:'আপনি ইতিমধ্যে এই ভোটে অংশ নিয়েছেন'};
  }
  const id = await fbAdd_(SHEETS.VOTES, {'ভোট_ID':pollId, 'সদস্য_ID':memberId, 'বাছাই':choice, 'তারিখ': Date.now()});
  return {status:'ok', message:'ভোট গ্রহণ করা হয়েছে', id};
}
async function closePoll_(id, actorRole){
  if(!requireManager_(actorRole)) return {status:'error', message:'শুধু ম্যানেজার ভোট বন্ধ করতে পারবেন'};
  await fbUpdate_(SHEETS.POLL, id, {'স্ট্যাটাস':'বন্ধ'});
  return {status:'ok', message:'ভোট বন্ধ করা হয়েছে'};
}

/* ---------------- generic add/edit/delete-এর রোল-গার্ড ---------------- */
const ROLE_GUARD = {};
ROLE_GUARD[SHEETS.INVEST] = [ROLES.MANAGER, ROLES.FIELD];
ROLE_GUARD[SHEETS.INVEST_INSTALLMENT] = [ROLES.MANAGER, ROLES.FIELD, ROLES.CASHIER];
ROLE_GUARD[SHEETS.CUSTODIAN] = [ROLES.MANAGER, ROLES.FIELD];
ROLE_GUARD[SHEETS.BABY] = [ROLES.MANAGER, ROLES.FIELD];
ROLE_GUARD[SHEETS.EXPENSE] = [ROLES.MANAGER, ROLES.CASHIER];
ROLE_GUARD[SHEETS.NOTICE] = [ROLES.MANAGER];
ROLE_GUARD[SHEETS.POLL] = [ROLES.MANAGER];
ROLE_GUARD[SHEETS.RULES] = [ROLES.MANAGER];
function checkGuard_(sheetName, actorRole){
  const allowed = ROLE_GUARD[sheetName];
  if(!allowed) return true;
  return allowed.indexOf(actorRole) !== -1;
}

/* ---------------- ছবি "আপলোড" ----------------
   Google Drive-এর বদলে: রিসাইজ করা ছবিটাকে সরাসরি একটা data URL (base64
   স্ট্রিং) হিসেবে রেকর্ডের ফিল্ডেই সেভ করা হয় — এতে আলাদা কোনো স্টোরেজ
   সার্ভিস/বিলিং লাগে না, ফ্রি Realtime Database-এই কাজ চলে। */
async function uploadInvestmentImage_(data, actorRole){
  if([ROLES.MANAGER, ROLES.CASHIER, ROLES.FIELD, ROLES.MEMBER].indexOf(actorRole) === -1){
    return {status:'error', message:'এই কাজের অনুমতি নেই'};
  }
  data = data || {};
  if(!data.base64) return {status:'error', message:'কোনো ছবি পাওয়া যায়নি'};
  const mimeType = data.mimeType || 'image/jpeg';
  const url = 'data:' + mimeType + ';base64,' + data.base64;
  return {status:'ok', message:'ছবি প্রস্তুত হয়েছে', data:{url}};
}

/* ---------------- generic add/edit/delete ---------------- */
async function addRow_(sheetName, data, actorRole){
  if(!checkGuard_(sheetName, actorRole)) return {status:'error', message:'এই কাজের অনুমতি নেই'};
  const obj = Object.assign({}, data || {});
  const now = Date.now();
  if(obj['তারিখ'] === undefined) obj['তারিখ'] = now;
  if((sheetName===SHEETS.INVEST || sheetName===SHEETS.BABY) && obj['সর্বশেষ_আপডেট']===undefined) obj['সর্বশেষ_আপডেট'] = now;
  if(sheetName===SHEETS.INVEST && obj['শুরুর_তারিখ']===undefined) obj['শুরুর_তারিখ'] = now;
  const id = await fbAdd_(sheetName, obj);
  if(sheetName === SHEETS.INVEST_UPDATE && data && data['ইনভেস্টমেন্ট_ID']) await touchRowTimestamp_(SHEETS.INVEST, data['ইনভেস্টমেন্ট_ID']);
  if(sheetName === SHEETS.BABY_UPDATE && data && data['বাচ্চা_ID']) await touchRowTimestamp_(SHEETS.BABY, data['বাচ্চা_ID']);
  return {status:'ok', message:'যোগ করা হয়েছে', id};
}
async function editRow_(sheetName, id, data, actorRole){
  if(!checkGuard_(sheetName, actorRole)) return {status:'error', message:'এই কাজের অনুমতি নেই'};
  const snap = await fbDb.ref(sheetName+'/'+id).get();
  if(!snap.exists()) return {status:'error', message:'এন্ট্রি পাওয়া যায়নি'};
  const patch = Object.assign({}, data || {});
  if(sheetName===SHEETS.INVEST || sheetName===SHEETS.BABY) patch['সর্বশেষ_আপডেট'] = Date.now();
  await fbUpdate_(sheetName, id, patch);
  return {status:'ok', message:'আপডেট হয়েছে'};
}
async function deleteRow_(sheetName, id, actorRole){
  if(!checkGuard_(sheetName, actorRole)) return {status:'error', message:'এই কাজের অনুমতি নেই'};
  await fbDb.ref(sheetName+'/'+id).remove();
  return {status:'ok', message:'মুছে ফেলা হয়েছে'};
}

/* ---------------- নতুন ইনভেস্টমেন্ট (সাধারণ + বাকি বিক্রয়/মুরাবাহা) ---------------- */
async function addInvestment_(data, actorRole){
  if(!checkGuard_(SHEETS.INVEST, actorRole)) return {status:'error', message:'এই কাজের অনুমতি নেই'};
  data = data || {};
  const title = (data['শিরোনাম']||'').toString().trim();
  const type = (data['ধরন']||'').toString().trim();
  const amt = Number(data['বিনিয়োগ_টাকা']||0);
  if(!title || !type || !amt) return {status:'error', message:'শিরোনাম, ধরন ও বিনিয়োগের পরিমাণ আবশ্যক'};
  const now = Date.now();
  const isSale = type === SALE_TYPE;
  let currentValue, profit, salePrice, custName, custPhone, custAddr, totalInst, paidInst, paidAmt, dueAmt;
  if(isSale){
    salePrice = Number(data['বিক্রয়মূল্য']||0);
    custName = (data['গ্রাহকের_নাম']||'').toString().trim();
    if(!salePrice || !custName) return {status:'error', message:'বাকি বিক্রয়ের জন্য বিক্রয়মূল্য ও গ্রাহকের নাম আবশ্যক'};
    if(salePrice < amt) return {status:'error', message:'বিক্রয়মূল্য ক্রয়মূল্যের (বিনিয়োগ) চেয়ে কম হতে পারে না'};
    currentValue = salePrice; profit = salePrice - amt;
    custPhone = data['গ্রাহকের_ফোন']||''; custAddr = data['গ্রাহকের_ঠিকানা']||'';
    totalInst = Math.max(1, Number(data['মোট_কিস্তি']||1));
    paidInst = 0; paidAmt = 0; dueAmt = salePrice;
  } else {
    currentValue = Number(data['বর্তমান_মূল্য']||amt);
    profit = currentValue - amt;
    salePrice=''; custName=''; custPhone=''; custAddr='';
    totalInst=''; paidInst=''; paidAmt=''; dueAmt='';
  }
  const id = await fbAdd_(SHEETS.INVEST, {
    'শিরোনাম': title, 'ধরন': type, 'বিনিয়োগ_টাকা': amt, 'বর্তমান_মূল্য': currentValue,
    'লাভ_ক্ষতি': profit, 'অবস্থা': 'অনুমোদনের অপেক্ষায়', 'শুরুর_তারিখ': data['শুরুর_তারিখ']||now,
    'পরিচালক': data['পরিচালক']||'', 'প্রমাণ_লিংক': data['প্রমাণ_লিংক']||'', 'বিবরণ': data['বিবরণ']||'',
    'সর্বশেষ_আপডেট': now, 'বিক্রয়মূল্য': salePrice, 'গ্রাহকের_নাম': custName, 'গ্রাহকের_ফোন': custPhone,
    'গ্রাহকের_ঠিকানা': custAddr, 'মোট_কিস্তি': totalInst, 'পরিশোধিত_কিস্তি': paidInst,
    'পরিশোধিত_টাকা': paidAmt, 'বাকি_টাকা': dueAmt,
    'বাদ_পড়া_সদস্য': Array.isArray(data['বাদ_পড়া_সদস্য']) ? data['বাদ_পড়া_সদস্য'] : [],
    'বণ্টন': await computeProfitDistribution_(Array.isArray(data['বাদ_পড়া_সদস্য']) ? data['বাদ_পড়া_সদস্য'] : [])
  });
  return {status:'ok', message:'ইনভেস্টমেন্টের আবেদন ক্যাশিয়ারের কাছে অনুমোদনের জন্য পাঠানো হয়েছে', id};
}

/* ==================== ইনভেস্টমেন্ট অনুমোদন/বাতিল (শুধু ক্যাশিয়ার) ==================== */
async function verifyInvestment_(id, actorRole){
  if(actorRole !== ROLES.CASHIER) return {status:'error', message:'শুধু ক্যাশিয়ার ইনভেস্টমেন্ট অনুমোদন করতে পারবেন'};
  const snap = await fbDb.ref(SHEETS.INVEST+'/'+id).get();

}

/* প্রতিটা অনুমোদিত সদস্যের (বাদ-দেওয়া সদস্য বাদে) মোট যাচাইকৃত চাঁদার অনুপাতে
   শতকরা হিসাব বের করে — এই হিসাবটা ইনভেস্টমেন্ট তৈরির মুহূর্তেই স্থায়ীভাবে
   সংরক্ষণ করা হয়, যাতে পরে নতুন সদস্য এলে বা কেউ বেশি চাঁদা দিলেও পুরনো
   ইনভেস্টমেন্টের বণ্টন-অনুপাত অন্যায়ভাবে না বদলে যায়। */
async function computeProfitDistribution_(excludedIds){
  const [allUsers, allContrib] = await Promise.all([fbGetAll_(SHEETS.USERS), fbGetAll_(SHEETS.CONTRIB)]);
  const members = allUsers.filter(u => u['স্ট্যাটাস']==='অনুমোদিত' && excludedIds.indexOf(u['ID']) === -1);
  const verified = allContrib.filter(c => c['স্ট্যাটাস']==='ভেরিফাইড');
  const totals = {};
  members.forEach(u=>{ totals[u['ID']] = 0; });
  verified.forEach(c=>{ if(totals.hasOwnProperty(c['সদস্য_ID'])) totals[c['সদস্য_ID']] += Number(c['পরিমাণ']||0); });
  const grandTotal = Object.values(totals).reduce((s,v)=>s+v,0);
  const distribution = {};
  members.forEach(u=>{
    const amt = totals[u['ID']] || 0;
    const pct = grandTotal > 0 ? (amt / grandTotal * 100) : (members.length ? (100/members.length) : 0);
    distribution[u['ID']] = { 'নাম': u['নাম'], 'শতাংশ': Math.round(pct*10000)/10000, 'ভিত্তি_চাঁদা': amt };
  });
  return distribution;
}

/* ---------------- বাকি বিক্রয়ের কিস্তি আদায় ---------------- */
async function addInstallment_(data, actorRole){
  if(!checkGuard_(SHEETS.INVEST_INSTALLMENT, actorRole)) return {status:'error', message:'এই কাজের অনুমতি নেই'};
  data = data || {};
  const investId = data['ইনভেস্টমেন্ট_ID'];
  const amount = Number(data['পরিমাণ']||0);
  if(!investId || isNaN(amount) || amount < 0) return {status:'error', message:'ইনভেস্টমেন্ট ও কিস্তির পরিমাণ আবশ্যক'};
  const invSnap = await fbDb.ref(SHEETS.INVEST+'/'+investId).get();
  if(!invSnap.exists()) return {status:'error', message:'ইনভেস্টমেন্ট এন্ট্রি পাওয়া যায়নি'};
  const iv = invSnap.val();
  if(iv['ধরন'] !== SALE_TYPE) return {status:'error', message:'এটা বাকি বিক্রয় এন্ট্রি নয়'};
  const dueBefore = Number(iv['বাকি_টাকা']||0);
  if(amount > dueBefore) return {status:'error', message:'কিস্তির পরিমাণ বাকি টাকার চেয়ে বেশি হতে পারে না (বাকি: ৳'+dueBefore+')'};
  const instNo = Number(iv['পরিশোধিত_কিস্তি']||0) + 1;
  const now = Date.now();
  const instId = await fbAdd_(SHEETS.INVEST_INSTALLMENT, {
    'ইনভেস্টমেন্ট_ID': investId, 'কিস্তি_নম্বর': instNo, 'পরিমাণ': amount,
    'মাধ্যম': data['মাধ্যম']||'', 'আদায়কারী': data['আদায়কারী']||'', 'তারিখ': now
  });
  const paidTotal = Number(iv['পরিশোধিত_টাকা']||0) + amount;
  const dueAfter = Math.max(0, dueBefore - amount);
  const newStatus = dueAfter <= 0 ? 'পরিশোধিত' : 'চলমান';
  await fbUpdate_(SHEETS.INVEST, investId, {
    'পরিশোধিত_কিস্তি': instNo, 'পরিশোধিত_টাকা': paidTotal, 'বাকি_টাকা': dueAfter,
    'অবস্থা': newStatus, 'সর্বশেষ_আপডেট': now
  });
  return {status:'ok', message: newStatus==='পরিশোধিত' ? 'শেষ কিস্তি জমা হয়েছে, সম্পূর্ণ পরিশোধিত' : 'কিস্তি জমা হয়েছে', id: instId};
}

/* ==================== লেনদেন (ফিল্ড পরিচালক/ম্যানেজার → ক্যাশিয়ার যাচাই) ==================== */
async function submitTransaction_(data, actorRole){
  if([ROLES.FIELD, ROLES.MANAGER].indexOf(actorRole) === -1) return {status:'error', message:'শুধু ফিল্ড পরিচালক বা ম্যানেজার লেনদেন সাবমিট করতে পারবেন'};
  data = data || {};
  const category = (data['ধরন']||'').toString().trim();
  const amount = Number(data['পরিমাণ']);
  const desc = (data['বিবরণ']||'').toString().trim();
  const submitterId = data['সাবমিটকারী_ID'];
  const submitterName = (data['সাবমিটকারীর_নাম']||'').toString().trim();
  const submitterRole = (data['সাবমিটকারীর_পদ']||actorRole).toString().trim();
  if(!category || isNaN(amount) || amount < 0 || !desc || !submitterId || !submitterName){
    return {status:'error', message:'ধরন, পরিমাণ, বিস্তারিত বিবরণ ও সাবমিটকারীর তথ্য আবশ্যক'};
  }
  const now = Date.now();
  const id = await fbAdd_(SHEETS.TRANSACTION, {
    'ধরন': category, 'সংশ্লিষ্ট_তথ্য': data['ইনভেস্টমেন্ট_ID']||data['সংশ্লিষ্ট_তথ্য']||'', 'পরিমাণ': amount, 'বিবরণ': desc,
    'সাবমিটকারী_ID': submitterId, 'সাবমিটকারীর_নাম': submitterName, 'সাবমিটকারীর_পদ': submitterRole,
    'স্ট্যাটাস':'পেন্ডিং', 'বাতিলের_কারণ':'', 'জমার_তারিখ': now, 'যাচাইকারী':'', 'যাচাইয়ের_তারিখ':''
  });
  return {status:'ok', message:'লেনদেনের আবেদন ক্যাশিয়ারের কাছে ভেরিফিকেশনের জন্য পাঠানো হয়েছে', id};
}

async function applyVerifiedTransactionEffect_(category, investId, amount, actorRole, submitterName){
  if(category === TXN_TYPE_INSTALLMENT){
    if(!investId) return {status:'error', message:'এই লেনদেনে ইনভেস্টমেন্টের তথ্য নেই, কিস্তি হিসাবে যোগ করা যাচ্ছে না'};
    return await addInstallment_({'ইনভেস্টমেন্ট_ID':investId, 'পরিমাণ':amount, 'আদায়কারী':submitterName||''}, actorRole);
  }
  if(category === TXN_TYPE_INVEST_CASH){
    if(!investId) return {status:'error', message:'এই লেনদেনে ইনভেস্টমেন্টের তথ্য নেই, টাকা যোগ করা যাচ্ছে না'};
    const invSnap = await fbDb.ref(SHEETS.INVEST+'/'+investId).get();
    if(!invSnap.exists()) return {status:'error', message:'সংশ্লিষ্ট ইনভেস্টমেন্ট এন্ট্রি পাওয়া যায়নি'};
    const iv = invSnap.val();
    const investedAmt = Number(iv['বিনিয়োগ_টাকা']||0);
    const paidBefore = Number(iv['পরিশোধিত_টাকা']||0);
    const plBefore = Number(iv['লাভ_ক্ষতি']||0);
    const profitLoss = plBefore + (amount - investedAmt);
    const now = Date.now();
    await fbUpdate_(SHEETS.INVEST, investId, {
      'পরিশোধিত_টাকা': paidBefore + amount, 'লাভ_ক্ষতি': profitLoss,
      'বর্তমান_মূল্য': 0, 'অবস্থা': 'সমাপ্ত', 'সর্বশেষ_আপডেট': now
    });
    const noteText = 'ইনভেস্টমেন্ট থেকে প্রাপ্ত টাকা: ৳'+amount+' (বিনিয়োগ ছিল ৳'+investedAmt+' — '+(profitLoss>=0?'লাভ':'ক্ষতি')+' ৳'+Math.abs(profitLoss)+') — ইনভেস্টমেন্টটি বন্ধ করা হয়েছে';
    await fbAdd_(SHEETS.INVEST_UPDATE, {'ইনভেস্টমেন্ট_ID':investId, 'ছবি_লিংক':'', 'নোট':noteText, 'সদস্য_ID':'', 'সদস্যের_নাম':submitterName||'', 'সদস্যের_ফোন':'', 'তারিখ': now});
    return {status:'ok'};
  }
  return {status:'ok'};
}

async function verifyTransaction_(id, verifier, actorRole){
  if(actorRole !== ROLES.CASHIER) return {status:'error', message:'শুধু ক্যাশিয়ার যাচাই করতে পারবেন'};
  const snap = await fbDb.ref(SHEETS.TRANSACTION+'/'+id).get();
  if(!snap.exists()) return {status:'error', message:'লেনদেন পাওয়া যায়নি'};
  const t = snap.val();
  if(t['স্ট্যাটাস'] !== 'পেন্ডিং') return {status:'error', message:'এই লেনদেনটি এখন পেন্ডিং অবস্থায় নেই'};
  const effect = await applyVerifiedTransactionEffect_(t['ধরন'], t['সংশ্লিষ্ট_তথ্য'], Number(t['পরিমাণ']||0), actorRole, t['সাবমিটকারীর_নাম']);
  if(effect && effect.status === 'error') return effect;
  await fbUpdate_(SHEETS.TRANSACTION, id, {'স্ট্যাটাস':'ভেরিফাইড', 'যাচাইকারী': verifier||'', 'যাচাইয়ের_তারিখ': Date.now()});
  return {status:'ok', message:'লেনদেন ভেরিফাই করা হয়েছে, এটি এখন কার্যকর এবং হ্যান্ড ক্যাশে যোগ হয়ে গেছে'};
}

  reason = (reason||'').toString().trim();
  if(!reason) return {status:'error', message:'বাতিলের কারণ লেখা আবশ্যক'};
  const snap = await fbDb.ref(SHEETS.TRANSACTION+'/'+id).get();

  if(snap.val()['স্ট্যাটাস'] !== 'পেন্ডিং') return {status:'error', message:'এই লেনদেনটি এখন পেন্ডিং অবস্থায় নেই'};
  await fbUpdate_(SHEETS.TRANSACTION, id, {'স্ট্যাটাস':'বাতিল', 'বাতিলের_কারণ':reason, 'যাচাইকারী':verifier||'', 'যাচাইয়ের_তারিখ': Date.now()});

}

async function reviseTransaction_(id, data, actorRole){
  if([ROLES.FIELD, ROLES.MANAGER].indexOf(actorRole) === -1) return {status:'error', message:'শুধু ফিল্ড পরিচালক বা ম্যানেজার সংশোধন করতে পারবেন'};
  const snap = await fbDb.ref(SHEETS.TRANSACTION+'/'+id).get();
  if(!snap.exists()) return {status:'error', message:'লেনদেন পাওয়া যায়নি'};
  if(snap.val()['স্ট্যাটাস'] !== 'বাতিল') return {status:'error', message:'শুধু বাতিল হওয়া লেনদেনই সংশোধন করা যাবে'};
  data = data || {};
  const patch = {};
  ['ধরন','পরিমাণ','বিবরণ','সংশ্লিষ্ট_তথ্য'].forEach(key=>{ if(data[key] !== undefined) patch[key] = data[key]; });
  patch['স্ট্যাটাস'] = 'পেন্ডিং'; patch['বাতিলের_কারণ'] = ''; patch['যাচাইকারী'] = ''; patch['যাচাইয়ের_তারিখ'] = ''; patch['জমার_তারিখ'] = Date.now();
  await fbUpdate_(SHEETS.TRANSACTION, id, patch);
  return {status:'ok', message:'সংশোধিত আবেদনটি আবার ক্যাশিয়ারের কাছে পাঠানো হয়েছে'};
}

async function deleteTransaction_(id, actorRole){
  if([ROLES.FIELD, ROLES.MANAGER].indexOf(actorRole) === -1) return {status:'error', message:'শুধু ফিল্ড পরিচালক বা ম্যানেজার মুছতে পারবেন'};
  const snap = await fbDb.ref(SHEETS.TRANSACTION+'/'+id).get();
  if(!snap.exists()) return {status:'error', message:'লেনদেন পাওয়া যায়নি'};
  if(snap.val()['স্ট্যাটাস'] !== 'বাতিল') return {status:'error', message:'শুধু বাতিল হওয়া লেনদেনই মুছে ফেলা যাবে'};
  await fbDb.ref(SHEETS.TRANSACTION+'/'+id).remove();

}

/* ==================== লভ্যাংশ বণ্টন ====================
   একটা ইনভেস্টমেন্ট "সমাপ্ত" হওয়ার পর ম্যানেজার/ক্যাশিয়ার এই বণ্টন কার্যকর
   করতে পারেন — প্রতিটা অংশগ্রহণকারী সদস্যের জন্য তার নির্ধারিত % অনুযায়ী
   একটা আলাদা লভ্যাংশ-রেকর্ড তৈরি হয় (একবারই করা যাবে)। */
async function distributeDividend_(investId, actorRole){
  if(actorRole !== ROLES.CASHIER) return {status:'error', message:'শুধু ক্যাশিয়ার লভ্যাংশ বণ্টন করতে পারবেন'};
  const snap = await fbDb.ref(SHEETS.INVEST+'/'+investId).get();
  if(!snap.exists()) return {status:'error', message:'ইনভেস্টমেন্ট এন্ট্রি পাওয়া যায়নি'};
  const iv = snap.val();
  if(iv['অবস্থা'] !== 'সমাপ্ত') return {status:'error', message:'শুধু সমাপ্ত হওয়া ইনভেস্টমেন্টেরই লভ্যাংশ বণ্টন করা যাবে'};
  if(iv['বণ্টন_সম্পন্ন']) return {status:'error', message:'এই ইনভেস্টমেন্টের লভ্যাংশ ইতিমধ্যে বণ্টন করা হয়েছে'};
  const dist = iv['বণ্টন'] || {};
  const ids = Object.keys(dist);
  if(!ids.length) return {status:'error', message:'এই ইনভেস্টমেন্টের জন্য কোনো বণ্টন হিসাব সংরক্ষিত নেই (পুরনো এন্ট্রি)'};
  const pl = Number(iv['লাভ_ক্ষতি']||0);
  const now = Date.now();
  const actorName = session ? session['নাম'] : '';
  for(const uid of ids){
    const d = dist[uid];
    const pct = Number(d['শতাংশ']||0);
    const amount = Math.round((pct/100 * pl) * 100) / 100;
    await fbAdd_(SHEETS.DIVIDEND, {
      'ইনভেস্টমেন্ট_ID': investId, 'ইনভেস্টমেন্টের_শিরোনাম': iv['শিরোনাম']||'',
      'সদস্য_ID': uid, 'সদস্যের_নাম': d['নাম']||'', 'শতাংশ': pct, 'পরিমাণ': amount,
      'তারিখ': now, 'বিতরণকারী': actorName
    });
  }
  await fbUpdate_(SHEETS.INVEST, investId, {'বণ্টন_সম্পন্ন': true, 'বণ্টনের_তারিখ': now, 'বণ্টনকারী': actorName});
  return {status:'ok', message: ids.length+' জন সদস্যের মধ্যে লভ্যাংশ বণ্টন সম্পন্ন হয়েছে'};
}

function money(n){ n = Number(n)||0; return n.toLocaleString('bn-BD'); }

/* সিলেক্ট করা ছবি আপলোডের আগে ছোট/কমপ্রেস করে base64 data URL বানায়,
   যাতে আপলোড দ্রুত হয় এবং শিট/Drive-এ বেশি জায়গা না নেয় */
function resizeImageToDataUrl_(file, maxDim, quality){
  maxDim = maxDim || 1024;
  quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('ছবি পড়া যায়নি'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('ছবি পড়া যায়নি'));
    reader.readAsDataURL(file);
  });
}

function getAvailableYears_(){
  const years = new Set();
  years.add(new Date().getFullYear());
  cache.contrib.forEach(c=>{ const y = new Date(Number(c['যাচাইয়ের_তারিখ'])||0).getFullYear(); if(y>2000) years.add(y); });
  cache.invest.forEach(i=>{ const y = new Date(Number(i['শুরুর_তারিখ'])||0).getFullYear(); if(y>2000) years.add(y); });
  cache.expense.forEach(x=>{ const y = new Date(Number(x['তারিখ'])||0).getFullYear(); if(y>2000) years.add(y); });
  cache.dividend.forEach(d=>{ const y = new Date(Number(d['তারিখ'])||0).getFullYear(); if(y>2000) years.add(y); });
  return Array.from(years).sort((a,b)=>b-a);
}

  const totalExpenseYear = yearExpense.reduce((s,x)=>s+Number(x['পরিমাণ']||0),0);

function fmtDate(d){
  if(d === undefined || d === null || d === '') return '';
  let dt;
  if(typeof d === 'number'){
    dt = new Date(d);
  } else {
    const s = String(d).trim();
    if(/^\d+$/.test(s) && s.length >= 10){
      // Date.now()-এর মতো সংখ্যাসূচক টাইমস্ট্যাম্প, স্ট্রিং আকারে এসে থাকলে
      dt = new Date(Number(s));
    } else if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
      // শুধু তারিখ (সময় নেই), যেমন "2026-08-07"
      dt = new Date(s + 'T00:00:00');
    } else {
      dt = new Date(s);
    }
  }
  if(isNaN(dt.getTime())) return String(d);
  const dateStr = dt.toLocaleDateString('bn-BD', {year:'numeric', month:'long', day:'numeric'});
  // ঠিক মধ্যরাত (00:00:00.000) মানে ধরে নেওয়া হয় এটা শুধু তারিখ-ভিত্তিক এন্ট্রি, সময় দেখানোর দরকার নেই
  const hasRealTime = !(dt.getHours()===0 && dt.getMinutes()===0 && dt.getSeconds()===0 && dt.getMilliseconds()===0);
  if(!hasRealTime) return dateStr;
  const timeStr = dt.toLocaleTimeString('bn-BD', {hour:'numeric', minute:'2-digit', hour12:true});
  return dateStr + ', ' + timeStr;
}
function currentMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

        msg.textContent='রিকুয়েস্ট পাঠানো হয়েছে। ম্যানেজার অনুমোদন দিলে জানানো হবে।'; msg.className='status-msg ok';
      }catch(e){ msg.textContent='পাঠাতে ব্যর্থ: '+e.message; msg.className='status-msg err'; }
    });
    return;
  }
  if(authMode==='login'){
    card.innerHTML = `
      <h2>লগইন করুন</h2>
      <label>ইউজারনেম</label>
      <input type="text" id="lUser" placeholder="ইউজারনেম">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="lPass">
      <button class="btn full" id="loginBtn">লগইন</button>
      <div class="status-msg" id="authMsg"></div>
      <p style="font-size:12px;margin-top:10px;"><a href="#" id="forgotLink">পাসওয়ার্ড ভুলে গেছেন?</a></p>`;
    document.getElementById('forgotLink').addEventListener('click', (e)=>{ e.preventDefault(); authMode='forgot'; renderAuthScreen(); });
    document.getElementById('loginBtn').addEventListener('click', async ()=>{
      const username = document.getElementById('lUser').value.trim();
      const pass = document.getElementById('lPass').value;
      const msg = document.getElementById('authMsg');
      if(!username || !pass){ msg.textContent='ইউজারনেম ও পাসওয়ার্ড দিন'; msg.className='status-msg err'; return; }
      msg.textContent = 'লগইন হচ্ছে...'; msg.className='status-msg';
      try{
        const email = usernameToEmail_(username);
        const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
        const uid = cred.user.uid;
        const idxSnap = await fbDb.ref(SHEETS.USER_INDEX+'/'+uid).get();
        const memberId = idxSnap.val();
        if(!memberId){ await fbAuth.signOut(); throw new Error('প্রোফাইল লিংক পাওয়া যায়নি'); }
        const snap = await fbDb.ref(SHEETS.USERS+'/'+memberId).get();
        if(!snap.exists()){ await fbAuth.signOut(); throw new Error('ইউজার প্রোফাইল পাওয়া যায়নি'); }
        const profile = snap.val();
        if(profile['স্ট্যাটাস'] !== 'অনুমোদিত'){
          await fbAuth.signOut();
          throw new Error('আপনার অ্যাকাউন্ট এখনো ম্যানেজার অনুমোদন করেননি');
        }
        profile['ID'] = memberId;
        await saveSession(profile);
        startRealtimeSync();
        await refreshAll();
        checkDuePaymentReminder_();
        toast('স্বাগতম, ' + profile['নাম']);
        activeTab = defaultTabFor(profile['রোল']);
        render();
      }catch(e){
        let m = e.message || 'লগইন ব্যর্থ';
        if(e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') m = 'ইউজারনেম বা পাসওয়ার্ড ভুল';
        msg.textContent = m; msg.className='status-msg err';
      }
    });
  } else {
    card.innerHTML = `
      <h2>নতুন অ্যাকাউন্ট খুলুন</h2>
      <label>ইউজারনেম</label>

      <label>ফোন নম্বর</label>
      <input type="tel" id="rPhone" placeholder="01xxxxxxxxx">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="rPass">
      <button class="btn full" id="regBtn">আবেদন পাঠান</button>
      <div class="status-msg" id="authMsg"></div>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">নতুন অ্যাকাউন্ট সরাসরি সক্রিয় হবে না — ম্যানেজার অনুমোদনের পর লগইন করতে পারবেন।</p>`;
    document.getElementById('regBtn').addEventListener('click', async ()=>{
      const username = document.getElementById('rUser').value.trim();
      const name = document.getElementById('rName').value.trim();
      const phone = document.getElementById('rPhone').value.trim();
      const pass = document.getElementById('rPass').value;

      if(!/^[A-Za-z0-9_.]+$/.test(username)){ msg.textContent='ইউজারনেম শুধু ইংরেজি অক্ষর/সংখ্যা/আন্ডারস্কোর হতে হবে (স্পেস/বাংলা চলবে না)'; msg.className='status-msg err'; return; }
      if(pass.length < 6){ msg.textContent='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে'; msg.className='status-msg err'; return; }
      msg.textContent = 'আবেদন পাঠানো হচ্ছে...'; msg.className='status-msg';
      try{
        const email = usernameToEmail_(username);
        const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
        const uid = cred.user.uid;
        // এই ইউজারনেমে কোনো পুরনো প্রোফাইল আগে থেকেই আছে কিনা দেখা হচ্ছে —
        // থাকলে বুঝতে হবে এটা "পাসওয়ার্ড রিসেট"-এর পর ফিরে আসা পুরনো সদস্য
        // (কারণ সক্রিয় থাকা অবস্থায় একই ইউজারনেমে নতুন অ্যাকাউন্ট তৈরিই হতো না)
        const allUsers = await fbGetAll_(SHEETS.USERS);
        const existing = allUsers.find(u => String(u['ইউজারনেম']||'').toLowerCase() === username.toLowerCase());
        if(existing){
          await fbDb.ref(SHEETS.USER_INDEX+'/'+uid).set(existing['ID']);
          await fbDb.ref(SHEETS.USERS+'/'+existing['ID']+'/authUid').set(uid);
          await fbAuth.signOut();
          msg.textContent = 'পুরনো অ্যাকাউন্ট ও ইতিহাসসহ নতুন পাসওয়ার্ড সেট হয়েছে। এখন লগইন করুন।'; msg.className='status-msg ok';
          authMode='login';
          setTimeout(renderAuthScreen, 1300);
          return;
        }
        const memberId = fbDb.ref(SHEETS.USERS).push().key;
        await fbDb.ref(SHEETS.USER_INDEX+'/'+uid).set(memberId);
        await fbDb.ref(SHEETS.USERS+'/'+memberId).set({
          'ID': memberId, 'ইউজারনেম': username, 'নাম': name, 'ফোন': phone, 'authUid': uid,
          'রোল': ROLES.MEMBER, 'স্ট্যাটাস': 'পেন্ডিং', 'যোগদানের_তারিখ': Date.now()
        });
        await fbAuth.signOut();
        msg.textContent='আবেদন জমা হয়েছে। ম্যানেজারের অনুমোদনের অপেক্ষায় থাকুন।'; msg.className='status-msg ok';
        authMode='login';
        setTimeout(renderAuthScreen, 1300);
      }catch(e){
        let m = e.message || 'আবেদন ব্যর্থ';
        if(e.code === 'auth/email-already-in-use') m = 'এই ইউজারনেমটি এখনো সক্রিয় আছে — নতুন পাসওয়ার্ড লাগলে "পাসওয়ার্ড ভুলে গেছেন?" ব্যবহার করুন';
        if(e.code === 'auth/weak-password') m = 'পাসওয়ার্ড খুব দুর্বল';
        msg.textContent = m; msg.className='status-msg err';
      }
    });
  }
}

/* ==================== অফলাইন সাপোর্ট (সীমিত — শুধু পড়ার জন্য) ====================
   ইন্টারনেট চলে গেলে নতুন কিছু লেখা/আপডেট করা যাবে না, কিন্তু শেষবার দেখা ডেটা
   ব্রাউজারেই থেকে যাবে, তাই সংযোগ ফিরে আসার আগ পর্যন্ত অন্তত আগের তথ্য দেখা যাবে। */
async function saveCacheSnapshot_(){
  try{ await localSet('cacheSnapshot', {cache, savedAt: Date.now()}); }catch(e){}
}
async function loadCacheSnapshot_(){
  try{
    const snap = await localGet('cacheSnapshot', null);
    if(snap && snap.cache){ cache = snap.cache; lastSyncAt = snap.savedAt; return true; }
  }catch(e){}
  return false;
}
window.addEventListener('online', ()=>{
  isOffline = false;
  toast('ইন্টারনেট সংযোগ ফিরে এসেছে — আপডেট হচ্ছে');
  if(session){ refreshAll().then(()=>{ lastSyncAt = Date.now(); saveCacheSnapshot_(); }).catch(()=>{}); startRealtimeSync(); }
  if(session) render();
});
window.addEventListener('offline', ()=>{
  isOffline = true;
  toast('ইন্টারনেট সংযোগ নেই — শেষ দেখা তথ্য দেখানো হচ্ছে');
  if(session) render();
});

function computeDueMemberCount_(){
  const approvedMembers = cache.users.filter(u=>u['স্ট্যাটাস']==='অনুমোদিত');
  const month = currentMonth();
  const submittedIds = new Set(cache.contrib.filter(c=>String(c['মাস']).slice(0,7)===month && c['স্ট্যাটাস']!=='বাতিল').map(c=>String(c['সদস্য_ID'])));
  return approvedMembers.filter(u=>!submittedIds.has(String(u['ID']))).length;
}
/* ১৬ তারিখ থেকে, ক্যাশিয়ার/ম্যানেজার যতবারই অ্যাপ খুলুন না কেন, দিনে সর্বোচ্চ
   একবার বকেয়া সদস্যের সংখ্যাসহ একটা ডেস্কটপ নোটিফিকেশন দেখানো হয় (যদি
   নোটিফিকেশন চালু থাকে) — সত্যিকারের সার্ভার-পুশ ছাড়া এটাই সবচেয়ে কাছাকাছি
   ফ্রি সমাধান। */
async function checkDuePaymentReminder_(){
  if(!session) return;
  if(session['রোল'] !== ROLES.CASHIER && session['রোল'] !== ROLES.MANAGER) return;
  const today = new Date();
  if(today.getDate() < 16) return;
  const todayKey = today.toISOString().slice(0,10);
  const lastShown = await localGet('dueReminderShown', '');
  if(lastShown === todayKey) return;
  await localSet('dueReminderShown', todayKey);
  const dueCount = computeDueMemberCount_();
  if(dueCount > 0){
    notifyBrowser_('চাঁদা বকেয়া রিমাইন্ডার', dueCount+' জন সদস্যের এই মাসের চাঁদা এখনো বাকি আছে');
  }
}

function pendingCountFor_(tabId, role){
  if(tabId==='members' && role===ROLES.MANAGER){
    return cache.users.filter(u=>u['স্ট্যাটাস']==='পেন্ডিং').length + cache.resetReq.filter(r=>r['স্ট্যাটাস']==='পেন্ডিং').length;
  }
  if(tabId==='contrib' && (role===ROLES.CASHIER || role===ROLES.MANAGER)){
    return cache.contrib.filter(c=>c['স্ট্যাটাস']==='পেন্ডিং').length;
  }
  if(tabId==='transaction' && (role===ROLES.CASHIER || role===ROLES.MANAGER)){
    return cache.transaction.filter(t=>t['স্ট্যাটাস']==='পেন্ডিং').length + cache.withdrawal.filter(w=>w['স্ট্যাটাস']==='পেন্ডিং').length;
  }
  return 0;
}

/* সংগঠনের নিয়মাবলী — হেডারের ট্যাগলাইনে ট্যাপ করলে ঠিক নিচেই এই প্যানেলটা খোলে/বন্ধ হয়
   (headerRulesPanel-এর ভেতরটা renderShell()-এর বাইরে আলাদাভাবে আঁকা হয় যাতে
   কোডটা ছোট ও পুনর্ব্যবহারযোগ্য থাকে) */
function paintHeaderRules_(){
  const isManager = session['রোল']===ROLES.MANAGER;
  const listEl = document.getElementById('headerRulesList');
  if(!listEl) return;
  listEl.innerHTML='';
  const rulesSorted = [...cache.rules].sort((a,b)=>String(a['তারিখ']).localeCompare(String(b['তারিখ'])));
  if(!rulesSorted.length){
    listEl.innerHTML = '<div style="font-size:12.5px;color:var(--brass-soft);opacity:.8;">এখনো কোনো নিয়ম যোগ করা হয়নি</div>';
  } else {
    rulesSorted.forEach(r=>{
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.15);font-size:12.5px;line-height:1.6;color:#F3EFE1;';
      row.innerHTML = `
        <span style="flex:1;">${r['বিবরণ']||''}</span>
        ${isManager? `<button data-rule-del="${r['ID']}" style="flex:none;border:none;background:none;color:var(--terracotta);font-size:11.5px;cursor:pointer;text-decoration:underline;">মুছুন</button>` : ''}`;
      listEl.appendChild(row);
    });
    if(isManager){
      listEl.querySelectorAll('[data-rule-del]').forEach(btn=>{
        btn.addEventListener('click', async ()=>{
          if(!confirm('এই নিয়মটা মুছে ফেলতে চান?')) return;
          try{
            await apiPost('delete', {sheet: SHEETS.RULES, id: btn.dataset.ruleDel});
            toast('নিয়ম মুছে ফেলা হয়েছে');
            await refreshAll();
            paintHeaderRules_();
          }catch(e){ toast(e.message); }
        });
      });
    }
  }
  if(isManager){
    const addBtn = document.getElementById('addRuleBtn');
    if(addBtn) addBtn.addEventListener('click', async ()=>{
      const input = document.getElementById('newRuleInput');
      const ruleMsg = document.getElementById('ruleMsg');
      const text = input.value.trim();
      if(!text){ ruleMsg.textContent='নিয়মের বিবরণ লিখুন'; ruleMsg.className='status-msg err'; return; }
      try{
        await apiPost('add', {sheet: SHEETS.RULES, data:{'বিবরণ': text}});
        input.value=''; ruleMsg.textContent=''; ruleMsg.className='status-msg';
        toast('নিয়ম যোগ করা হয়েছে');
        await refreshAll();
        paintHeaderRules_();
      }catch(e){ ruleMsg.textContent=e.message; ruleMsg.className='status-msg err'; }
    });
  }
}

/* ==================== মাল্টি-ডিভাইস রিয়েল-টাইম সিঙ্ক ====================
   একবার লগইন হলে, প্রতিটা ডেটা-নোডে একটা "লাইভ" শোনার ব্যবস্থা (listener) বসানো
   হয়। কোনো ডিভাইস/ব্যবহারকারী ডেটা বদলালেই (নিজে হোক বা অন্য কেউ), সব
   ডিভাইসের ক্যাশ স্বয়ংক্রিয়ভাবে আপডেট হয়ে বর্তমান ট্যাবটা আবার আঁকা হয়ে যায়
   — পেজ রিফ্রেশ করার দরকার হয় না। */
let realtimeRefs = [];
let rerenderTimer = null;
function scheduleTabRerender(){
  if(rerenderTimer) clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(()=>{
    rerenderTimer = null;
    const active = document.activeElement;
    const isTyping = active && ['INPUT','TEXTAREA','SELECT'].indexOf(active.tagName) !== -1;
    // কেউ যদি ঠিক এই মুহূর্তে কোনো ফর্মে টাইপ করছে, তাহলে এখনই রি-রেন্ডার করে
    // তার লেখা মুছে দেওয়া হবে না — একটু পরে আবার চেষ্টা করবে
    if(isTyping){ scheduleTabRerender(); return; }
    if(session){ try{ renderTab(); updateTabBadges_(); if(rulesOpen) paintHeaderRules_(); lastSyncAt = Date.now(); saveCacheSnapshot_(); }catch(e){} }
  }, 600);
}
function updateTabBadges_(){
  const tabsEl = document.getElementById('tabs');
  if(!tabsEl || !session) return;
  const tabs = tabsFor(session['রোল']);
  tabsEl.innerHTML = tabs.map(t=>{
    const cnt = pendingCountFor_(t.id, session['রোল']);
    return `<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}"><span class="ic">${t.ic}</span>${t.label}${cnt? `<span class="tab-badge">${cnt>99?'99+':cnt}</span>` : ''}</button>`;
  }).join('');
}
function notifyBrowser_(title, body){
  if(!notifyEnabled) return;
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try{ new Notification(title, {body: body||'', tag: title+body}); }catch(e){}
}
function notifyForNewItems_(key, added){
  if(!added.length) return;
  const myRole = session ? session['রোল'] : null;
  added.forEach(item=>{
    if(key==='contrib' && item['স্ট্যাটাস']==='পেন্ডিং' && (myRole===ROLES.CASHIER || myRole===ROLES.MANAGER)){
      notifyBrowser_('নতুন চাঁদা জমার আবেদন', (item['সদস্যের_নাম']||'')+' — ৳'+(item['পরিমাণ']||''));
    }
    if(key==='transaction' && item['স্ট্যাটাস']==='পেন্ডিং' && (myRole===ROLES.CASHIER || myRole===ROLES.MANAGER)){
      notifyBrowser_('নতুন লেনদেনের আবেদন', (item['ধরন']||'')+' — ৳'+(item['পরিমাণ']||''));
    }
    if(key==='users' && item['স্ট্যাটাস']==='পেন্ডিং' && myRole===ROLES.MANAGER){
      notifyBrowser_('নতুন সদস্য আবেদন', (item['নাম']||'')+' (@'+(item['ইউজারনেম']||'')+')');
    }
    if(key==='resetReq' && item['স্ট্যাটাস']==='পেন্ডিং' && myRole===ROLES.MANAGER){
      notifyBrowser_('পাসওয়ার্ড রিসেট রিকুয়েস্ট', '@'+(item['ইউজারনেম']||''));
    }
    if(key==='withdrawal' && item['স্ট্যাটাস']==='পেন্ডিং' && (myRole===ROLES.CASHIER || myRole===ROLES.MANAGER)){
      notifyBrowser_('লভ্যাংশ উত্তোলনের আবেদন', (item['সদস্যের_নাম']||'')+' — ৳'+(item['পরিমাণ']||''));
    }
    if(key==='notice'){
      notifyBrowser_('নতুন নোটিশ', item['শিরোনাম']||item['বিবরণ']||'');
    }
  });
}

function startRealtimeSync(){
  stopRealtimeSync();
  const map = [
    [SHEETS.USERS,'users'], [SHEETS.CONTRIB,'contrib'], [SHEETS.INVEST,'invest'],
    [SHEETS.INVEST_UPDATE,'investUpdate'], [SHEETS.INVEST_INSTALLMENT,'investInstallment'],
    [SHEETS.CUSTODIAN,'custodians'], [SHEETS.BABY,'babies'], [SHEETS.BABY_UPDATE,'babyUpdate'],
    [SHEETS.EXPENSE,'expense'], [SHEETS.NOTICE,'notice'], [SHEETS.POLL,'poll'],
    [SHEETS.VOTES,'votes'], [SHEETS.TRANSACTION,'transaction'], [SHEETS.RESET_REQ,'resetReq'], [SHEETS.ACTIVITY_LOG,'activityLog'], [SHEETS.DIVIDEND,'dividend'], [SHEETS.WITHDRAWAL,'withdrawal']
  ];
  map.forEach(([sheetName, key])=>{
    let isFirst = true;
    const ref = fbDb.ref(sheetName);
    const cb = ref.on('value', snap=>{
      const val = snap.val();
      const newList = val ? Object.keys(val).map(k=>{ const o = Object.assign({}, val[k]); o.ID = k; return o; }) : [];
      if(!isFirst){
        const oldIds = new Set(cache[key].map(x=>x['ID']));
        const added = newList.filter(x=>!oldIds.has(x['ID']));
        notifyForNewItems_(key, added);
      }
      isFirst = false;
      cache[key] = newList;
      scheduleTabRerender();
    }, err=>{ /* সাধারণত permission-denied — লগআউট হয়ে যাওয়ার পর পুরনো লিসেনার হলে চুপচাপ উপেক্ষা করা হয় */ });
    realtimeRefs.push({ref, cb});
  });
}
function stopRealtimeSync(){
  realtimeRefs.forEach(({ref, cb})=>{ try{ ref.off('value', cb); }catch(e){} });
  realtimeRefs = [];
}

/* ---------------- SHARED: org-wide summary bar (সদস্য/মোট জমা/বিনিয়োগ/লাভ-ক্ষতি/হ্যান্ড ক্যাশ) ----------------
   ম্যানেজার, ক্যাশিয়ার, ফিল্ড পরিচালক ও সাধারণ সদস্য — সবাই এই সংখ্যাগুলো দেখতে পারবে।
   বিনিয়োগ ও লাভ/ক্ষতি চিপে ক্লিক করলে ইনভেস্টের বিস্তারিত তালিকায় নিয়ে যাবে।
   হ্যান্ড ক্যাশ = ভেরিফাইড চাঁদা - খরচ - ইনভেস্টমেন্টে দেওয়া টাকা + সব ইনভেস্টমেন্ট থেকে
   এ পর্যন্ত ফেরত-আসা নগদ (বাকি বিক্রয়ের কিস্তি, লভ্যাংশ, বিক্রয়মূল্য, উদ্ধারকৃত টাকা — সবই
   'পরিশোধিত_টাকা' কলামে জমা থাকে, তাই এক জায়গা থেকেই যোগফল বের করা যায়)। */
function orgSummaryBarHtml_(role){
  const totalMembers = cache.users.filter(u=>u['স্ট্যাটাস']==='অনুমোদিত').length;
  const totalContrib = cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড').reduce((s,c)=>s+Number(c['পরিমাণ']||0),0);
  const activeInvests = cache.invest.filter(i=>i['অবস্থা']!=='অনুমোদনের অপেক্ষায়' && i['অবস্থা']!=='প্রত্যাখ্যাত');
  const totalInvest = activeInvests.reduce((s,i)=>s+Number(i['বিনিয়োগ_টাকা']||0),0);
  const totalPL = activeInvests.reduce((s,i)=>s+Number(i['লাভ_ক্ষতি']||0),0);
  const totalExpense = cache.expense.reduce((s,x)=>s+Number(x['পরিমাণ']||0),0);
  const totalCashReturned = activeInvests.reduce((s,i)=>s+Number(i['পরিশোধিত_টাকা']||0),0);
  const totalWithdrawn = cache.withdrawal.filter(w=>w['স্ট্যাটাস']==='অনুমোদিত').reduce((s,w)=>s+Number(w['পরিমাণ']||0),0);
  const handCash = totalContrib - totalExpense - totalInvest + totalCashReturned - totalWithdrawn;
  // পাঁচটা চিপই সবার জন্য ক্লিকযোগ্য — প্রতিটা নিজস্ব বিস্তারিত পেজে নিয়ে যায়,
  // রোলের ট্যাব-তালিকায় সেই আইডি আছে কিনা তার উপর নির্ভর করে না
  return `
    <div class="summary-bar" id="orgSummaryBar">
      <div class="summary-chip" data-nav="members"><div class="lbl">সদস্য</div><div class="val">${money(totalMembers)}</div></div>
      <div class="summary-chip" data-nav="contribSummary"><div class="lbl">মোট জমা</div><div class="val">৳${money(totalContrib)}</div></div>
      <div class="summary-chip" data-nav="invest"><div class="lbl">বিনিয়োগ</div><div class="val">৳${money(totalInvest)}</div></div>
      <div class="summary-chip" data-nav="plDetail"><div class="lbl">লাভ/ক্ষতি</div><div class="val" style="color:${totalPL>=0?'var(--sage)':'var(--terracotta)'}">৳${money(totalPL)}</div></div>
      <div class="summary-chip" data-nav="handcash"><div class="lbl">হ্যান্ড ক্যাশ</div><div class="val" style="color:${handCash>=0?'var(--sage)':'var(--terracotta)'}">৳${money(handCash)}</div></div>
    </div>`;
}
function bindOrgSummaryNav_(){
  const bar = document.getElementById('orgSummaryBar');
  if(!bar) return;
  bar.querySelectorAll('[data-nav]').forEach(chip=>{
    chip.style.cursor = 'pointer';
    chip.addEventListener('click', ()=>{ activeTab = chip.dataset.nav; renderShell(); });
  });
}

/* ---------------- MANAGER: dashboard ---------------- */
/* ---------------- ড্যাশবোর্ড গ্রাফ ---------------- */
function computeMonthlyContribData_(){
  const verified = cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড');
  const map = {};
  verified.forEach(c=>{
    const key = String(c['মাস']||'').slice(0,7);
    if(!/^\d{4}-\d{2}$/.test(key)) return; // "লভ্যাংশ রি-ইনভেস্ট"-এর মতো অ-মাস এন্ট্রি বাদ
    map[key] = (map[key]||0) + Number(c['পরিমাণ']||0);
  });
  const months = Object.keys(map).sort().slice(-12);
  return { labels: months, values: months.map(m=>map[m]) };
}
function computeInvestGrowthData_(){
  const activeInvests = cache.invest.filter(i=>i['অবস্থা']!=='অনুমোদনের অপেক্ষায়' && i['অবস্থা']!=='প্রত্যাখ্যাত');
  const sorted = [...activeInvests].sort((a,b)=>Number(a['শুরুর_তারিখ']||0)-Number(b['শুরুর_তারিখ']||0));
  let cum = 0;
  const labels = [], values = [];
  sorted.forEach(iv=>{
    cum += Number(iv['বিনিয়োগ_টাকা']||0);
    labels.push(fmtDate(iv['শুরুর_তারিখ']));
    values.push(cum);
  });
  return { labels, values };
}
function renderDashboardCharts_(){
  if(typeof Chart === 'undefined'){
    const c1 = document.getElementById('chartContrib'), c2 = document.getElementById('chartInvest');
    const msg = '<div class="empty">গ্রাফ লোড করা যায়নি — ইন্টারনেট সংযোগ চেক করুন (Chart.js লাইব্রেরি লোড হয়নি)</div>';
    if(c1) c1.parentElement.insertAdjacentHTML('beforeend', msg);
    if(c2) c2.parentElement.insertAdjacentHTML('beforeend', msg);
    return;
  }
  const contribData = computeMonthlyContribData_();
  const investData = computeInvestGrowthData_();
  const ctx1 = document.getElementById('chartContrib');
  const ctx2 = document.getElementById('chartInvest');
  if(chartContribInstance){ chartContribInstance.destroy(); chartContribInstance = null; }
  if(chartInvestInstance){ chartInvestInstance.destroy(); chartInvestInstance = null; }
  if(ctx1){
    if(!contribData.labels.length){
      ctx1.parentElement.insertAdjacentHTML('beforeend', '<div class="empty" id="chartContribEmpty">এখনো কোনো যাচাইকৃত চাঁদা নেই</div>');
    } else {
      const oldEmpty = document.getElementById('chartContribEmpty'); if(oldEmpty) oldEmpty.remove();
      chartContribInstance = new Chart(ctx1, {
        type: 'bar',
        data: { labels: contribData.labels, datasets: [{ label:'চাঁদা আদায় (৳)', data: contribData.values, backgroundColor:'#0f4c3a', borderRadius:4 }] },
        options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
      });
    }
  }
  if(ctx2){
    if(!investData.labels.length){
      ctx2.parentElement.insertAdjacentHTML('beforeend', '<div class="empty" id="chartInvestEmpty">এখনো কোনো সক্রিয় ইনভেস্টমেন্ট নেই</div>');
    } else {
      const oldEmpty = document.getElementById('chartInvestEmpty'); if(oldEmpty) oldEmpty.remove();
      chartInvestInstance = new Chart(ctx2, {
        type: 'line',
        data: { labels: investData.labels, datasets: [{ label:'ক্রমবর্ধমান বিনিয়োগ (৳)', data: investData.values, borderColor:'#a67c2e', backgroundColor:'rgba(166,124,46,0.15)', fill:true, tension:0.3, pointRadius:3 }] },
        options: { responsive:true, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true}} }
      });
    }
  }
}
