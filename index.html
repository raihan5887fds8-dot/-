function renderMyAccount(main){
  const myId = session['ID'];
  const myContribTotal = cache.contrib.filter(c=>String(c['সদস্য_ID'])===String(myId) && c['স্ট্যাটাস']==='ভেরিফাইড').reduce((s,c)=>s+Number(c['পরিমাণ']||0),0);

  const participations = cache.invest.filter(iv => iv['বণ্টন'] && iv['বণ্টন'][myId]).sort((a,b)=>String(b['শুরুর_তারিখ']).localeCompare(String(a['শুরুর_তারিখ'])));
  let liveShareTotal = 0;
  const rowsHtml = participations.map(iv=>{
    const d = iv['বণ্টন'][myId];
    const pct = Number(d['শতাংশ']||0);
    const share = (pct/100) * Number(iv['লাভ_ক্ষতি']||0);
    if(!iv['বণ্টন_সম্পন্ন']) liveShareTotal += share;
    const statusColor = iv['অবস্থা']==='সমাপ্ত' ? '#2e7d5b' : (iv['অবস্থা']==='পরিশোধিত' ? '#2e7d5b' : '#a67c2e');
    return `<div class="list-item">
      <div class="li-top">
        <div><div class="li-name">${iv['শিরোনাম']}</div><div class="li-meta">${iv['ধরন']} · আমার শেয়ার: ${pct.toFixed(2)}%</div></div>
        <span class="badge" style="background:${statusColor};color:#fff;">${iv['অবস্থা']}</span>
      </div>
      <div class="li-meta" style="margin-top:4px;">লাভ/ক্ষতিতে আমার ভাগ (বর্তমান হিসাবে): <b style="color:${share>=0?'#2e7d5b':'#b3402a'};">৳${money(share)}</b></div>
      ${iv['বণ্টন_সম্পন্ন']? `<div class="li-meta" style="color:#2e7d5b;">✓ লভ্যাংশ বণ্টিত হয়ে গেছে — ${fmtDate(iv['বণ্টনের_তারিখ'])}</div>` : `<div class="li-meta" style="color:#a67c2e;">এখনও বণ্টন হয়নি (ইনভেস্টমেন্ট সমাপ্ত হয়ে বণ্টন না হওয়া পর্যন্ত এটা শুধু আনুমানিক হিসাব)</div>`}
    </div>`;
  }).join('') || '<div class="empty">এখনো কোনো ইনভেস্টমেন্টে আপনার অংশগ্রহণ নেই</div>';

  const myDividends = cache.dividend.filter(d=>String(d['সদস্য_ID'])===String(myId)).sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
  // যে লভ্যাংশ ইতিমধ্যে "চাঁদা" হিসেবে রি-ইনভেস্ট হয়ে গেছে সেটা এখন চাঁদার
  // হিসাবেই আছে (myContribTotal-এ), তাই এখানে আর গোনা হবে না — নাহলে একই
  // টাকা দুইবার যোগ হয়ে যাবে। একইভাবে যেটা উত্তোলন হয়ে গেছে (হাতে নগদ
  // নিয়ে নেওয়া হয়েছে) সেটাও আর সংগঠনের নিট ব্যালেন্সের অংশ না।
  const dividendCountable = myDividends.filter(d => d['ব্যবস্থা'] !== 'রি-ইনভেস্ট_সম্পন্ন' && d['ব্যবস্থা'] !== 'উত্তোলিত');
  const dividendTotal = dividendCountable.reduce((s,d)=>s+Number(d['পরিমাণ']||0),0);
  const lossReceived = dividendCountable.filter(d=>Number(d['পরিমাণ']||0)<0).reduce((s,d)=>s+Number(d['পরিমাণ']||0),0); // ঋণাত্মক
  const profitReceived = dividendCountable.filter(d=>Number(d['পরিমাণ']||0)>=0).reduce((s,d)=>s+Number(d['পরিমাণ']||0),0);
  const netBalance = myContribTotal + dividendTotal; // চাঁদা + (এখনো চাঁদায় রূপান্তরিত/উত্তোলিত হয়নি এমন) লভ্যাংশ
  const dividendRowsHtml = myDividends.map(d=>`
    <div class="list-item">
      <div class="li-top">
        <div><div class="li-name">${d['ইনভেস্টমেন্টের_শিরোনাম']||''}</div><div class="li-meta">${d['শতাংশ'].toFixed(2)}% · ${fmtDate(d['তারিখ'])}</div></div>
        <span style="font-weight:700;color:${d['পরিমাণ']>=0?'#2e7d5b':'#b3402a'};">৳${money(d['পরিমাণ'])}</span>
      </div>
    </div>`).join('') || '<div class="empty">এখনো কোনো লভ্যাংশ বণ্টন হয়নি</div>';

  main.innerHTML = `
    <div class="card">
      <h2>আমার হিসাব — সারাংশ</h2>
      <div class="summary-bar">
        <div class="summary-chip"><div class="lbl">মোট জমাকৃত চাঁদা</div><div class="val">৳${money(myContribTotal)}</div></div>
        <div class="summary-chip"><div class="lbl">চলমান ইনভেস্টে আনুমানিক ভাগ</div><div class="val" style="color:${liveShareTotal>=0?'var(--sage)':'var(--terracotta)'}">৳${money(liveShareTotal)}</div></div>
        <div class="summary-chip"><div class="lbl">মোট প্রাপ্ত লভ্যাংশ</div><div class="val" style="color:${dividendTotal>=0?'var(--sage)':'var(--terracotta)'}">৳${money(dividendTotal)}</div></div>
      </div>
      <button class="btn full" id="myReportBtn" style="margin-top:10px;">📄 আমার সম্পূর্ণ রিপোর্ট প্রিন্ট করুন</button>
    </div>
    <div class="card" id="netBalanceCard" style="border-color:${netBalance>=0?'var(--sage)':'var(--terracotta)'};cursor:pointer;">
      <h2>নিট ব্যালেন্স <span class="li-meta">(ক্লিক করে বিস্তারিত ইতিহাস দেখুন)</span></h2>
      <div style="font-size:26px;font-weight:800;color:${netBalance>=0?'var(--sage)':'var(--terracotta)'};margin:4px 0 10px;">৳${money(netBalance)}</div>
      <div class="li-meta">= মোট চাঁদা (৳${money(myContribTotal)}) ${dividendTotal>=0? '+ প্রাপ্ত লাভ (৳'+money(profitReceived)+')' : ''}${lossReceived<0? ' − প্রাপ্ত ক্ষতির অংশ (৳'+money(Math.abs(lossReceived))+')' : ''}</div>
      ${(profitReceived>0 && lossReceived<0)? `<div class="li-meta" style="margin-top:2px;">(এই হিসাবে লাভ ৳${money(profitReceived)} ও ক্ষতি ৳${money(Math.abs(lossReceived))} — দুটোই ধরা হয়েছে)</div>` : ''}
      <div class="li-meta" style="margin-top:6px;color:#888;">* শুধু নিষ্পন্ন (বণ্টন হয়ে যাওয়া) লভ্যাংশ এখানে ধরা হয়েছে; চলমান ইনভেস্টমেন্টের আনুমানিক ভাগ উপরের কার্ডে আলাদাভাবে দেখানো আছে, সেটা এখনো এই ব্যালেন্সে যোগ হয়নি।</div>
    </div>
    <div class="card"><h2>ইনভেস্টমেন্টে আমার অংশগ্রহণ (${participations.length}টি)</h2>${rowsHtml}</div>
    <div class="card"><h2>লভ্যাংশ পাওয়ার ইতিহাস (${myDividends.length}টি)</h2>${dividendRowsHtml}</div>`;
  document.getElementById('netBalanceCard').addEventListener('click', showNetBalanceHistoryModal_);
  document.getElementById('myReportBtn').addEventListener('click', ()=> printMemberReport_(session));
}

function renderHome(main){
  const my = cache.contrib.filter(c=>String(c['সদস্য_ID'])===String(session['ID']));
  const myVerified = my.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড');
  const totalPaid = myVerified.reduce((s,c)=>s+Number(c['পরিমাণ']||0),0);
  const month = currentMonth();
  const paidThisMonth = myVerified.some(c=>String(c['মাস']).slice(0,7)===month);
  const history = [...my].sort((a,b)=>String(b['জমার_তারিখ']).localeCompare(String(a['জমার_তারিখ'])));

  const today = new Date();
  const isReminderPeriod = today.getDate() >= 16; // ১৬ তারিখ থেকে রিমাইন্ডার সক্রিয়

  main.innerHTML = `
    ${(!paidThisMonth && isReminderPeriod) ? `
    <div class="card" style="border-color:var(--terracotta);background:#fdecea;">
      <div style="font-weight:700;color:var(--terracotta);">⚠️ রিমাইন্ডার: এই মাসের (${month}) চাঁদা এখনো জমা দেননি</div>
      <div class="li-meta" style="margin-top:4px;">মাসের ১৫ তারিখ পার হয়ে গেছে — নিচের ফর্ম থেকে যত দ্রুত সম্ভব জমা দিন।</div>
    </div>` : ''}
    <div class="summary-bar">
      <div class="summary-chip"><div class="lbl">আমার মোট জমা</div><div class="val">৳${money(totalPaid)}</div></div>
      <div class="summary-chip"><div class="lbl">এ মাসের চাঁদা</div><div class="val" style="color:${paidThisMonth?'var(--sage)':'var(--terracotta)'}">${paidThisMonth?'জমা হয়েছে':'বাকি আছে'}</div></div>
    </div>
    ${orgSummaryBarHtml_(session['রোল'])}
    <div class="card">
      <h2>এ মাসের চাঁদা জমা দিন <small>(${month})</small></h2>
      <label>পরিমাণ (৳)</label>
      <input type="number" id="cAmt" value="500">
      <div class="row2">
        <div><label>মাধ্যম</label>
          <select id="cMethod"><option>বিকাশ</option><option>নগদ</option><option>রকেট</option><option>হাতে হাতে</option></select>
        </div>
        <div><label>ট্রানজেকশন আইডি (ঐচ্ছিক)</label><input type="text" id="cTx"></div>
      </div>
      <button class="btn full gold" id="submitContribBtn">রিকুয়েস্ট পাঠান</button>
      <div class="status-msg" id="cMsg"></div>
    </div>
    <div class="card">
      <h2>আমার জমার ইতিহাস</h2>
      <div id="myHistory">${history.length? '' : '<div class="empty">এখনো কোনো জমা নেই</div>'}</div>
    </div>`;
  bindOrgSummaryNav_();

  document.getElementById('submitContribBtn').addEventListener('click', async ()=>{
    const amt = document.getElementById('cAmt').value;
    const method = document.getElementById('cMethod').value;
    const tx = document.getElementById('cTx').value.trim();
    const msg = document.getElementById('cMsg');
    if(!amt){ msg.textContent='পরিমাণ দিন'; msg.className='status-msg err'; return; }
    try{
      await apiPost('submitContribution', {data:{
        'সদস্য_ID':session['ID'],'সদস্যের_নাম':session['নাম'],'মাস':month,
        'পরিমাণ':amt,'মাধ্যম':method,'ট্রানজেকশন_আইডি':tx
      }});
      toast('রিকুয়েস্ট পাঠানো হয়েছে, ক্যাশিয়ারের যাচাইয়ের অপেক্ষায় থাকুন');
      withRefreshThen(()=>renderTab());
    }catch(e){ msg.textContent=e.message; msg.className='status-msg err'; }
  });

  const el = document.getElementById('myHistory');
  history.forEach(c=>{
    const row = document.createElement('div'); row.className='list-item';
    const isV = c['স্ট্যাটাস']==='ভেরিফাইড';
    const isR = c['স্ট্যাটাস']==='বাতিল';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${c['মাস']}</div><div class="li-meta">${c['মাধ্যম']||''} · ${fmtDate(c['জমার_তারিখ'])}</div></div>
        <div style="text-align:right;">
          <div class="amt ${isV?'pos':''}">৳${money(c['পরিমাণ'])}</div>
          <span class="badge ${isV?'verified':(isR?'rejected':'pending')}">${c['স্ট্যাটাস']}</span>
        </div>
      </div>
      ${isV? `<div style="margin-top:6px;text-align:right;"><button class="btn small ghost" data-act="receipt">🧾 রশিদ ডাউনলোড</button></div>` : ''}`;
    if(isV){
      row.querySelector('[data-act="receipt"]').addEventListener('click', ()=> printContributionReceipt_(c));
    }
    el.appendChild(row);
  });
}

    <div class="card">
      <h2>রশিদ নম্বর দিয়ে খুঁজুন</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">কেউ প্রিন্ট করা রশিদ নিয়ে এলে সেই নম্বর দিয়ে সরাসরি এন্ট্রিটা খুঁজে বের করুন</p>
      <input type="text" id="receiptSearchInput" placeholder="যেমন: JXFUUNVQ" style="text-transform:uppercase;">
      <button class="btn full" id="receiptSearchBtn">খুঁজুন</button>
      <div id="receiptSearchResult" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h2>রিপোর্ট/এক্সপোর্ট</h2>
      <button class="btn full" id="expMembers" style="margin-bottom:8px;">📥 সদস্য তালিকা (Excel)</button>
      <button class="btn full" id="expContrib" style="margin-bottom:8px;">📥 চাঁদার হিসাব (Excel)</button>
      <button class="btn full" id="expInvest" style="margin-bottom:8px;">📥 ইনভেস্টমেন্ট সামারি (Excel)</button>
      <button class="btn full" id="expTxn" style="margin-bottom:8px;">📥 লেনদেনের হিসাব (Excel)</button>
      <button class="btn full gold" id="printReport">🖨️ ফুল রিপোর্ট প্রিন্ট/PDF (সবকিছুসহ)</button>
    </div>
    <div class="card">
      <h2>বার্ষিক প্রতিবেদন</h2>
      <p style="font-size:12px;color:var(--muted);margin-bottom:8px;">নির্দিষ্ট একটা বছরের সম্পূর্ণ আর্থিক চিত্র (মাসভিত্তিক চাঁদা, নতুন ইনভেস্টমেন্ট, লভ্যাংশ বণ্টন, সদস্য বৃদ্ধি)</p>
      <label>বছর বেছে নিন</label>
      <select id="annualYearSelect">${getAvailableYears_().map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
      <button class="btn full gold" id="annualReportBtn" style="margin-top:10px;">📅 বার্ষিক প্রতিবেদন তৈরি করুন</button>
    </div>` : ''}
    ${isManager ? `
    <div class="card">
      <h2>অ্যাক্টিভিটি লগ <small>(সাম্প্রতিক ${Math.min(logs.length,50)}টি)</small></h2>
      <input type="text" id="logSearch" placeholder="🔍 নাম বা কাজ দিয়ে খুঁজুন" value="${searchQuery.activityLog||''}" style="margin-bottom:10px;">
      <div id="activityLogList">${logs.length? '' : '<div class="empty">কোনো লগ নেই</div>'}</div>
    </div>` : ''}
    <button class="btn danger full" id="logoutBtn2">লগআউট করুন</button>`;

  document.getElementById('darkModeToggleBtn').addEventListener('click', async ()=>{
    darkMode = !darkMode;
    applyTheme_();
    await localSet('darkMode', darkMode);
    renderTab();
  });
  document.getElementById('pfPhotoBtn').addEventListener('click', ()=> document.getElementById('pfPhotoInput').click());
  document.getElementById('pfPhotoInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const pmsg = document.getElementById('pfPhotoMsg');
    pmsg.textContent = 'ছবি প্রস্তুত হচ্ছে...'; pmsg.className='status-msg';
    try{
      const dataUrl = await resizeImageToDataUrl_(file, 300, 0.8);
      document.getElementById('pfAvatarPreview').src = dataUrl;
      await fbDb.ref(SHEETS.USERS+'/'+session['ID']).update({'ছবি': dataUrl});
      session['ছবি'] = dataUrl;
      await saveSession(session);
      pmsg.textContent = 'ছবি আপডেট হয়েছে ✓'; pmsg.className='status-msg ok';
      toast('প্রোফাইল ছবি আপডেট হয়েছে');
    }catch(err){ pmsg.textContent = err.message || 'ছবি আপলোড ব্যর্থ'; pmsg.className='status-msg err'; }
  });

  document.getElementById('pfSaveBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('pfName').value.trim();
    const phone = document.getElementById('pfPhone').value.trim();
    const msg = document.getElementById('pfMsg');
    if(!name || !phone){ msg.textContent='নাম ও ফোন নম্বর দিন'; msg.className='status-msg err'; return; }
    msg.textContent='সংরক্ষণ হচ্ছে...'; msg.className='status-msg';
    try{
      await fbDb.ref(SHEETS.USERS+'/'+session['ID']).update({'নাম': name, 'ফোন': phone});
      session['নাম'] = name; session['ফোন'] = phone;
      await saveSession(session);
      logActivity_('profileEdit', '', 'নাম/ফোন আপডেট করেছেন');
      msg.textContent='প্রোফাইল আপডেট হয়েছে ✓'; msg.className='status-msg ok';
      toast('প্রোফাইল আপডেট হয়েছে');
    }catch(e){ msg.textContent = e.message; msg.className='status-msg err'; }
  });

  document.getElementById('pwSaveBtn').addEventListener('click', async ()=>{
    const oldPass = document.getElementById('pwOld').value;
    const newPass = document.getElementById('pwNew').value;
    const newPass2 = document.getElementById('pwNew2').value;
    const msg = document.getElementById('pwMsg');
    if(!oldPass || !newPass || !newPass2){ msg.textContent='সব ঘর পূরণ করুন'; msg.className='status-msg err'; return; }
    if(newPass.length < 6){ msg.textContent='নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে'; msg.className='status-msg err'; return; }
    if(newPass !== newPass2){ msg.textContent='নতুন পাসওয়ার্ড দুটো মিলছে না'; msg.className='status-msg err'; return; }
    msg.textContent='পরিবর্তন হচ্ছে...'; msg.className='status-msg';
    try{
      const user = fbAuth.currentUser;
      const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPass);
      await user.reauthenticateWithCredential(cred);
      await user.updatePassword(newPass);
      logActivity_('passwordChange', '', 'নিজে পাসওয়ার্ড বদলেছেন');
      msg.textContent='পাসওয়ার্ড বদলানো হয়েছে ✓'; msg.className='status-msg ok';
      toast('পাসওয়ার্ড বদলানো হয়েছে');
      document.getElementById('pwOld').value=''; document.getElementById('pwNew').value=''; document.getElementById('pwNew2').value='';
    }catch(e){
      let m = e.message || 'পরিবর্তন ব্যর্থ';
      if(e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') m = 'বর্তমান পাসওয়ার্ড ভুল';
      msg.textContent = m; msg.className='status-msg err';
    }
  });

  document.getElementById('notifyToggleBtn').addEventListener('click', async ()=>{
    const nmsg = document.getElementById('notifyMsg');
    if(notifyEnabled){
      notifyEnabled = false;
      await localSet('notifyEnabled', false);
      renderTab();
      return;
    }
    if(typeof Notification === 'undefined'){
      nmsg.textContent = 'এই ব্রাউজার নোটিফিকেশন সমর্থন করে না'; nmsg.className='status-msg err';
      return;
    }
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      nmsg.textContent = 'অনুমতি দেওয়া হয়নি — ব্রাউজার সেটিংস থেকে অনুমতি দিন'; nmsg.className='status-msg err';
      return;
    }
    notifyEnabled = true;
    await localSet('notifyEnabled', true);
    new Notification('নোটিফিকেশন চালু হয়েছে ✓', {body:'এখন থেকে নতুন আবেদন এলে জানানো হবে'});
    renderTab();
  });

  if(canMemberLookup){
    document.getElementById('memberReportBtn').addEventListener('click', ()=>{
      const uid = document.getElementById('memberReportSelect').value;
      const u = cache.users.find(x=>String(x['ID'])===String(uid));
      if(!u){ toast('সদস্য পাওয়া যায়নি'); return; }
      printMemberReport_(u);
    });
  }

  if(canReport){
    document.getElementById('expMembers').addEventListener('click', exportMembersExcel_);
    document.getElementById('expContrib').addEventListener('click', exportContribExcel_);
    document.getElementById('expInvest').addEventListener('click', exportInvestExcel_);
    document.getElementById('expTxn').addEventListener('click', exportTransactionExcel_);
    document.getElementById('printReport').addEventListener('click', printSummaryReport_);
    document.getElementById('annualReportBtn').addEventListener('click', ()=>{
      const year = document.getElementById('annualYearSelect').value;
      printAnnualReport_(year);
    });

    const doReceiptSearch = ()=>{
      const q = document.getElementById('receiptSearchInput').value.trim();
      const resultEl = document.getElementById('receiptSearchResult');
      if(!q){ resultEl.innerHTML = ''; return; }
      const c = findContributionByReceiptNo_(q);
      if(!c){
        resultEl.innerHTML = '<div class="empty">এই নম্বরে কোনো রশিদ পাওয়া যায়নি</div>';
        return;
      }
      const isV = c['স্ট্যাটাস']==='ভেরিফাইড';
      const isR = c['স্ট্যাটাস']==='বাতিল';
      resultEl.innerHTML = `
        <div class="list-item">
          <div class="li-top">
            <div><div class="li-name">${c['সদস্যের_নাম']}</div><div class="li-meta">${c['মাস']} · ${c['মাধ্যম']||''} · ${fmtDate(c['জমার_তারিখ'])}</div></div>
            <div style="text-align:right;">
              <div class="amt ${isV?'pos':''}">৳${money(c['পরিমাণ'])}</div>
              <span class="badge ${isV?'verified':(isR?'rejected':'pending')}">${c['স্ট্যাটাস']}</span>
            </div>
          </div>
          ${isV? `<div class="li-meta" style="margin-top:4px;">যাচাইকারী: ${c['যাচাইকারী']||''} · ${fmtDate(c['যাচাইয়ের_তারিখ'])}</div>
          <div style="margin-top:8px;"><button class="btn small ghost" id="receiptViewBtn">🧾 রশিদ আবার দেখুন</button></div>` : ''}
        </div>`;
      if(isV){
        document.getElementById('receiptViewBtn').addEventListener('click', ()=> printContributionReceipt_(c));
      }
    };
    document.getElementById('receiptSearchBtn').addEventListener('click', doReceiptSearch);
    document.getElementById('receiptSearchInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') doReceiptSearch(); });
  }

  if(isManager){
    document.getElementById('logSearch').addEventListener('input', (e)=>{ searchQuery.activityLog = e.target.value; renderTab(); });
    if(logHadFocus){ const ls = document.getElementById('logSearch'); ls.focus(); ls.selectionStart = ls.selectionEnd = ls.value.length; }
    const logEl = document.getElementById('activityLogList');
    logs.slice(0,50).forEach(l=>{
      const row = document.createElement('div'); row.className='list-item';
      row.innerHTML = `
        <div class="li-top">
          <div><div class="li-name">${l['কর্তা']} <span class="role-pill">${ROLE_LABEL[l['রোল']]||l['রোল']}</span></div>
          <div class="li-meta">${l['কাজ']}${l['বিস্তারিত']? ' — '+l['বিস্তারিত'] : ''}</div></div>
        </div>
        <div class="li-meta" style="margin-top:2px;">${fmtDate(l['তারিখ'])}</div>`;
      logEl.appendChild(row);
    });
  }

  document.getElementById('logoutBtn2').addEventListener('click', async ()=>{ await clearSession(); render(); });
}

/* ---------------- PWA: ইনস্টল বাটন (নিজে থেকেই দেখা যাবে, ব্রাউজার মেনু ঘাঁটতে হবে না) ---------------- */
let deferredInstallPrompt = null;
const isStandaloneMode = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isStandaloneMode){
    const b = document.getElementById('installBanner');
    if(b) b.style.display = 'flex';
  }
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  const b = document.getElementById('installBanner');
  if(b) b.style.display = 'none';
  toast('অ্যাপ ইনস্টল হয়েছে ✓');
});
// iOS Safari-তে beforeinstallprompt আসে না (Apple-এর নিয়ম), তাই আলাদাভাবে ইঙ্গিত দেওয়া হয়
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS && !isStandaloneMode){
  const b = document.getElementById('installBanner');
  if(b){
    b.querySelector('span').textContent = '📲 ইনস্টল করতে নিচের Share বাটনে চেপে "Add to Home Screen" বেছে নিন';
    b.querySelector('#installBannerBtn').style.display = 'none';
    b.style.display = 'flex';
  }
}
document.getElementById('installBannerBtn').addEventListener('click', async ()=>{
  const b = document.getElementById('installBanner');
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  if(b) b.style.display = 'none';
});
document.getElementById('installBannerClose').addEventListener('click', ()=>{
  document.getElementById('installBanner').style.display = 'none';
});

/* ---------------- PWA: সার্ভিস ওয়ার্কার রেজিস্ট্রেশন (ইনস্টল-অপশন চালু করার জন্য প্রয়োজনীয়) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{ /* file:// থেকে সরাসরি খুললে এটা কাজ করবে না, হোস্ট করা URL থেকেই কাজ করবে */ });
  });
}

/* ---------------- INIT ---------------- */
(async function init(){
  session = await localGet('session', null);
  notifyEnabled = await localGet('notifyEnabled', false);
  darkMode = await localGet('darkMode', false);
  applyTheme_();
  if(session){
    if(isOffline){
      await loadCacheSnapshot_();
    } else {
      try{ await refreshAll(); lastSyncAt = Date.now(); saveCacheSnapshot_(); }
      catch(e){ await loadCacheSnapshot_(); }
    }
    startRealtimeSync();
    checkDuePaymentReminder_();
  }
  render();
})();
</script>
