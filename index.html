function renderMembers(main){
  const isManager = session['রোল']===ROLES.MANAGER;
  // ম্যানেজার সব সদস্য (পেন্ডিং/বাতিলসহ) দেখেন ও এডিট করতে পারেন; অন্য সবাই শুধু
  // অনুমোদিত সদস্যদের নাম, পোষ্ট (রোল) ও ফোন নম্বর দেখতে পান — এডিট অপশন ছাড়া
  let users = isManager ? [...cache.users] : cache.users.filter(u=>u['স্ট্যাটাস']==='অনুমোদিত');
  switch(sortOrder.members){
    case 'name_asc': users.sort((a,b)=>String(a['নাম']).localeCompare(String(b['নাম']))); break;
    case 'name_desc': users.sort((a,b)=>String(b['নাম']).localeCompare(String(a['নাম']))); break;
    case 'joined_desc': users.sort((a,b)=>Number(b['যোগদানের_তারিখ']||0)-Number(a['যোগদানের_তারিখ']||0)); break;
    case 'joined_asc': users.sort((a,b)=>Number(a['যোগদানের_তারিখ']||0)-Number(b['যোগদানের_তারিখ']||0)); break;
    default: users.sort((a,b)=> isManager ? String(a['স্ট্যাটাস']).localeCompare(String(b['স্ট্যাটাস'])) : String(a['নাম']).localeCompare(String(b['নাম'])));
  }
  const q = (searchQuery.members||'').trim().toLowerCase();
  const hadFocus = document.activeElement && document.activeElement.id === 'memberSearch';
  if(q){
    users = users.filter(u => String(u['নাম']||'').toLowerCase().includes(q) || String(u['ইউজারনেম']||'').toLowerCase().includes(q) || String(u['ফোন']||'').includes(q));
  }
  const resetReqs = isManager ? cache.resetReq.filter(r=>r['স্ট্যাটাস']==='পেন্ডিং').sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ']))) : [];
  main.innerHTML = `
    ${isManager ? `
    <div class="card">
      <h2>পাসওয়ার্ড রিসেট রিকুয়েস্ট <small>(${resetReqs.length}টি)</small></h2>
      <div id="resetReqList">${resetReqs.length? '' : '<div class="empty">কোনো পেন্ডিং রিকুয়েস্ট নেই</div>'}</div>
    </div>` : ''}
    <div class="card">
      <h2>সদস্য তালিকা <small>(${users.length}জন)</small></h2>
      <input type="text" id="memberSearch" placeholder="🔍 নাম, ইউজারনেম বা ফোন দিয়ে খুঁজুন" value="${searchQuery.members||''}" style="margin-bottom:10px;">
      <label style="font-size:12px;">সাজান</label>
      <select id="memberSort" style="margin-bottom:10px;">
        <option value="status" ${sortOrder.members==='status'?'selected':''}>${isManager?'স্ট্যাটাস অনুযায়ী (ডিফল্ট)':'নাম (A-Z)'}</option>
        <option value="name_asc" ${sortOrder.members==='name_asc'?'selected':''}>নাম (A-Z)</option>
        <option value="name_desc" ${sortOrder.members==='name_desc'?'selected':''}>নাম (Z-A)</option>
        <option value="joined_desc" ${sortOrder.members==='joined_desc'?'selected':''}>যোগদান (নতুন আগে)</option>
        <option value="joined_asc" ${sortOrder.members==='joined_asc'?'selected':''}>যোগদান (পুরনো আগে)</option>
      </select>
      <div id="memberList"></div>
    </div>`;
  document.getElementById('memberSearch').addEventListener('input', (e)=>{ searchQuery.members = e.target.value; renderTab(); });
  document.getElementById('memberSort').addEventListener('change', (e)=>{ sortOrder.members = e.target.value; renderTab(); });
  if(hadFocus){ const ms = document.getElementById('memberSearch'); ms.focus(); ms.selectionStart = ms.selectionEnd = ms.value.length; }
  if(isManager){
    const rrList = document.getElementById('resetReqList');
    resetReqs.forEach(r=>{
      const row = document.createElement('div'); row.className='list-item';
      row.innerHTML = `
        <div class="li-top">
          <div><div class="li-name">@${r['ইউজারনেম']}</div><div class="li-meta">ফোন: ${r['ফোন']} · ${fmtDate(r['তারিখ'])}</div></div>
        </div>
        <div class="row-actions">
          <button class="btn small" data-act="approveReset">অনুমোদন করুন</button>
          <button class="btn small danger" data-act="dismissReset">উড়িয়ে দিন</button>
        </div>`;
      row.querySelector('[data-act="approveReset"]').addEventListener('click', async ()=>{
        showInfoModal('পাসওয়ার্ড রিসেট অনুমোদন', `
          এখন <a href="https://console.firebase.google.com/project/${firebaseConfig.projectId}/authentication/users" target="_blank" rel="noopener" style="color:#0f4c3a;font-weight:600;text-decoration:underline;">Firebase Console → Authentication</a>-এ গিয়ে
          "<b>${r['ইউজারনেম']}</b>"-এর পুরনো এন্ট্রিটা (ইমেইল অনেকটা <b>${r['ইউজারনেম'].toLowerCase()}@bondhuoikko.local</b> এর মতো দেখতে) খুঁজে মুছে দিন।
          এরপর সদস্যকে বলুন "নতুন অ্যাকাউন্ট" ফর্ম থেকে একই ইউজারনেম দিয়ে নতুন পাসওয়ার্ড সেট করতে — তার আগের সব ইতিহাস এমনিতেই ফিরে আসবে।
        `);
        try{ await fbDb.ref(SHEETS.RESET_REQ+'/'+r['ID']).update({'স্ট্যাটাস':'অনুমোদিত'}); logActivity_('passwordResetApprove', '@'+r['ইউজারনেম']); toast('অনুমোদন করা হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      row.querySelector('[data-act="dismissReset"]').addEventListener('click', async ()=>{
        try{ await fbDb.ref(SHEETS.RESET_REQ+'/'+r['ID']).remove(); logActivity_('passwordResetDismiss', '@'+r['ইউজারনেম']); toast('মুছে ফেলা হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      rrList.appendChild(row);
    });
  }
  const list = document.getElementById('memberList');
  if(!users.length){ list.innerHTML='<div class="empty">কোনো সদস্য নেই</div>'; return; }
  users.forEach(u=>{
    const row = document.createElement('div'); row.className='list-item';
    const statusBadge = u['স্ট্যাটাস']==='অনুমোদিত'?'approved':(u['স্ট্যাটাস']==='বাতিল'?'rejected':'pending');
    row.innerHTML = `
      <div class="li-top">
        <div style="display:flex;align-items:center;gap:10px;">
          <img src="${u['ছবি']||'https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(u['নাম']||'?')}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#eee;">
          <div><div class="li-name">${u['নাম']}</div><div class="li-meta">@${u['ইউজারনেম']} · ${u['ফোন']}${!isManager? ' · '+(ROLE_LABEL[u['রোল']]||u['রোল']) : ''}</div></div>
        </div>
        ${isManager? `<span class="badge ${statusBadge}">${u['স্ট্যাটাস']}</span>` : `<span class="role-pill">${ROLE_LABEL[u['রোল']]||u['রোল']}</span>`}
      </div>
      ${isManager? `
      <div class="row-actions">
        <select data-role style="width:auto;padding:5px 8px;font-size:12px;">
          ${Object.values(ROLES).map(r=>`<option value="${r}" ${u['রোল']===r?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
        </select>
        ${u['স্ট্যাটাস']==='পেন্ডিং' ? `<button class="btn small" data-act="approve">অনুমোদন</button><button class="btn small danger" data-act="reject">বাতিল</button>` : ''}
      </div>` : ''}`;
    if(isManager){
      row.querySelector('[data-role]').addEventListener('change', async (e)=>{
        try{ await apiPost('changeRole', {id:u['ID'], data:{'রোল': e.target.value}}); toast('রোল পরিবর্তিত হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(err){ toast(err.message); }
      });
      const ap = row.querySelector('[data-act="approve"]');
      if(ap) ap.addEventListener('click', async ()=>{ try{ await apiPost('approveUser',{id:u['ID']}); toast('অনুমোদন করা হয়েছে'); withRefreshThen(()=>renderTab()); }catch(e){toast(e.message);} });
      const rj = row.querySelector('[data-act="reject"]');
      if(rj) rj.addEventListener('click', async ()=>{ try{ await apiPost('rejectUser',{id:u['ID']}); toast('বাতিল করা হয়েছে'); withRefreshThen(()=>renderTab()); }catch(e){toast(e.message);} });
    }
    list.appendChild(row);
  });
}

/* ---------------- CASHIER (+ manager view): contributions ---------------- */
function renderContrib(main){
  const canVerify = session['রোল']===ROLES.CASHIER;
  const pending = cache.contrib.filter(c=>c['স্ট্যাটাস']==='পেন্ডিং').sort((a,b)=>String(b['জমার_তারিখ']).localeCompare(String(a['জমার_তারিখ'])));
  const verified = cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড').sort((a,b)=>String(b['যাচাইয়ের_তারিখ']).localeCompare(String(a['যাচাইয়ের_তারিখ'])));

  const approvedMembers = cache.users.filter(u=>u['স্ট্যাটাস']==='অনুমোদিত');
  const month = currentMonth();
  // মাস কলামের ভ্যালু মাঝেমধ্যে পুরো তারিখ হিসেবে সেভ হয়ে যেতে পারে (যেমন
  // "２০২６-０৭-０১T00:00:00"), তাই প্রথম ৭ অক্ষর (yyyy-MM অংশ) দিয়ে তুলনা করা হয়
  // — এতে কে এই মাসে ইতিমধ্যে জমা দিয়েছেন তা সঠিকভাবে বাদ পড়ে
  const submittedIds = new Set(cache.contrib.filter(c=>String(c['মাস']).slice(0,7)===month && c['স্ট্যাটাস']!=='বাতিল').map(c=>String(c['সদস্য_ID'])));
  const due = approvedMembers.filter(u=>!submittedIds.has(String(u['ID'])));

  main.innerHTML = `
    <div class="card">
      <h2>যাচাইয়ের অপেক্ষায় <small>(${pending.length}টি)</small></h2>
      <div id="pendingContrib">${pending.length? '' : '<div class="empty">কোনো পেন্ডিং চাঁদা নেই</div>'}</div>
    </div>
    <div class="card">
      <h2>এই মাসে বকেয়া <small>(${month})</small></h2>
      ${due.length? due.map(u=>`<div class="list-item"><div class="li-name">${u['নাম']}</div><div class="li-meta">@${u['ইউজারনেম']} · ${u['ফোন']}</div></div>`).join('') : '<div class="empty">সবাই এই মাসের চাঁদা জমা দিয়েছেন 🎉</div>'}
    </div>
    <div class="card">
      <h2>যাচাইকৃত চাঁদা</h2>
      <div id="verifiedContrib">${verified.length? '' : '<div class="empty">এখনো কোনো যাচাই হয়নি</div>'}</div>
    </div>`;

  const pList = document.getElementById('pendingContrib');
  pending.forEach(c=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${c['সদস্যের_নাম']} <span class="li-meta">· ${c['মাস']}</span></div>
        <div class="li-meta">${c['মাধ্যম']||''} ${c['ট্রানজেকশন_আইডি']?'· TxID: '+c['ট্রানজেকশন_আইডি']:''}</div></div>
        <span class="amt">৳${money(c['পরিমাণ'])}</span>
      </div>
      ${canVerify? `<div class="row-actions"><button class="btn small gold" data-act="verify">যাচাই করে অনুমোদন দিন</button><button class="btn small danger" data-act="reject">রিকুয়েস্ট বাতিল করুন</button></div>` : ''}`;
    const vb = row.querySelector('[data-act="verify"]');
    if(vb) vb.addEventListener('click', async ()=>{
      try{ await apiPost('verifyContribution', {id:c['ID'], data:{'যাচাইকারী': session['নাম']}}); toast('যাচাই সম্পন্ন হয়েছে'); withRefreshThen(()=>renderTab()); }
      catch(e){ toast(e.message); }
    });
    const rb = row.querySelector('[data-act="reject"]');
    if(rb) rb.addEventListener('click', async ()=>{
      if(!confirm('এই চাঁদার রিকুয়েস্টটি বাতিল করতে চান?')) return;
      try{ await apiPost('rejectContribution', {id:c['ID'], data:{'যাচাইকারী': session['নাম']}}); toast('রিকুয়েস্ট বাতিল করা হয়েছে'); withRefreshThen(()=>renderTab()); }
      catch(e){ toast(e.message); }
    });
    pList.appendChild(row);
  });

  const vList = document.getElementById('verifiedContrib');
  verified.slice(0,20).forEach(c=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${c['সদস্যের_নাম']} <span class="li-meta">· ${c['মাস']}</span></div>
        <div class="li-meta">যাচাই: ${c['যাচাইকারী']||''} · ${fmtDate(c['যাচাইয়ের_তারিখ'])}</div></div>
        <span class="amt pos">৳${money(c['পরিমাণ'])} <span class="stamp">✓ ভেরিফাইড</span></span>
      </div>`;
    vList.appendChild(row);
  });
}

/* ---------------- ফিল্ড পরিচালক/ম্যানেজার → ক্যাশিয়ার: লেনদেন ----------------
   ফিল্ড পরিচালক/ম্যানেজার হাতে টাকা রাখতে পারেন না। এই ট্যাব শুধুমাত্র
   ইনভেস্টমেন্ট/কিস্তি সংক্রান্ত টাকার জন্য — তাই এখানে ধরন ফ্রি-টেক্সট নয়,
   বরং নির্দিষ্ট দুটো ক্যাটাগরির একটা বেছে নিয়ে (কিস্তি আদায় / ইনভেস্টমেন্ট
   থেকে প্রাপ্ত টাকা) ঠিক কোন ইনভেস্টমেন্টের সাথে সম্পর্কিত তা তালিকা থেকে
   বেছে নিতে হয়। শুধু ক্যাশিয়ার যাচাই/অনুমোদন করলে তবেই সেটা কার্যকর ধরা হয়
   এবং সংশ্লিষ্ট ইনভেস্টমেন্টের হিসাবে যোগ হয়। ক্যাশিয়ার বাতিল করলে কারণসহ
   সাবমিটকারীর কাছে ফেরত আসে — সেখান থেকে সাবমিটকারী চাইলে আবেদনটি একেবারে
   মুছে দিতে পারেন (যেন কখনো হয়ইনি), অথবা তথ্য সংশোধন করে আবার পাঠাতে পারেন। */
const TXN_TYPE_INSTALLMENT = 'কিস্তি আদায়';
const TXN_TYPE_INVEST_CASH = 'ইনভেস্টমেন্ট থেকে প্রাপ্ত টাকা';

function txnInvestOptions_(type){
  if(type===TXN_TYPE_INSTALLMENT){
    // শুধু "বাকি বিক্রয়" জাতীয় ইনভেস্টমেন্ট, যেগুলোর কিস্তি এখনো বাকি আছে
    return cache.invest.filter(iv=>iv['ধরন']===SALE_TYPE && iv['অবস্থা']!=='পরিশোধিত');
  }
  // ইনভেস্টমেন্ট থেকে প্রাপ্ত টাকা (বিক্রয়/লভ্যাংশ/উদ্ধারকৃত ইত্যাদি) — চলমান ও সমাপ্ত সব ইনভেস্টমেন্ট
  return cache.invest.filter(iv=>iv['অবস্থা']==='চলমান' || iv['অবস্থা']==='সমাপ্ত');
}
function txnInvestOptionLabel_(iv, type){
  if(type===TXN_TYPE_INSTALLMENT) return `${iv['শিরোনাম']} — বাকি ৳${money(iv['বাকি_টাকা'])}`;
  return `${iv['শিরোনাম']} (${iv['ধরন']})`;
}

function renderTransaction(main, role){
  const canSubmit = role===ROLES.FIELD || role===ROLES.MANAGER;
  const canVerify = role===ROLES.CASHIER; // অনুমোদন/বাতিল করার ক্ষমতা শুধু ক্যাশিয়ারের — ম্যানেজার/ফিল্ড পরিচালক শুধু সাবমিট করতে পারবেন
  const canApproveWithdrawal = role===ROLES.CASHIER;
  const pendingWithdrawals = cache.withdrawal.filter(w=>w['স্ট্যাটাস']==='পেন্ডিং').sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
  const mine = cache.transaction.filter(t=>String(t['সাবমিটকারী_ID'])===String(session['ID']));
  const pending = cache.transaction.filter(t=>t['স্ট্যাটাস']==='পেন্ডিং').sort((a,b)=>String(b['জমার_তারিখ']).localeCompare(String(a['জমার_তারিখ'])));
  // "মূল্য হালনাগাদ" অনুরোধের কোনো ইতিহাস রাখা হয় না — অনুমোদন বা বাতিল দুই
  // ক্ষেত্রেই সরাসরি মুছে ফেলা হয়, তাই সতর্কতাবশত এখানেও বাদ দেওয়া হলো
  const rejectedMine = mine.filter(t=>t['স্ট্যাটাস']==='বাতিল' && t['ধরন']!=='মূল্য হালনাগাদ').sort((a,b)=>String(b['যাচাইয়ের_তারিখ']).localeCompare(String(a['যাচাইয়ের_তারিখ'])));
  let verified = cache.transaction.filter(t=>t['স্ট্যাটাস']==='ভেরিফাইড' && t['ধরন']!=='মূল্য হালনাগাদ');
  switch(sortOrder.transaction){
    case 'date_asc': verified.sort((a,b)=>String(a['যাচাইয়ের_তারিখ']).localeCompare(String(b['যাচাইয়ের_তারিখ']))); break;
    case 'amount_desc': verified.sort((a,b)=>Number(b['পরিমাণ']||0)-Number(a['পরিমাণ']||0)); break;
    case 'amount_asc': verified.sort((a,b)=>Number(a['পরিমাণ']||0)-Number(b['পরিমাণ']||0)); break;
    default: verified.sort((a,b)=>String(b['যাচাইয়ের_তারিখ']).localeCompare(String(a['যাচাইয়ের_তারিখ'])));
  }
  const tq = (searchQuery.transaction||'').trim().toLowerCase();
  const verifiedFiltered = tq ? verified.filter(t =>
    String(t['বিবরণ']||'').toLowerCase().includes(tq) ||
    String(t['সাবমিটকারীর_নাম']||'').toLowerCase().includes(tq) ||
    String(t['ধরন']||'').toLowerCase().includes(tq)
  ) : verified;
  const txnHadFocus = document.activeElement && document.activeElement.id === 'txnSearch';

  main.innerHTML = `
    ${canSubmit? `
    <div class="card">
      <h2>ইনভেস্টমেন্ট/কিস্তি থেকে প্রাপ্ত টাকা সাবমিট করুন <small>(ক্যাশিয়ারের অনুমোদনের জন্য)</small></h2>
      <label>ধরন</label>
      <select id="tType">
        <option value="${TXN_TYPE_INSTALLMENT}">${TXN_TYPE_INSTALLMENT} (বাকি বিক্রয়ের কিস্তি)</option>
        <option value="${TXN_TYPE_INVEST_CASH}">${TXN_TYPE_INVEST_CASH} (বিক্রয়মূল্য/লভ্যাংশ/উদ্ধারকৃত)</option>
      </select>
      <label>কোন ইনভেস্টমেন্ট</label>
      <select id="tInvest"></select>
      <div class="status-msg" id="tInvestHint"></div>
      <label>পরিমাণ (৳)</label>
      <input type="number" id="tAmount">
      <label>বিস্তারিত বিবরণ</label>
      <textarea id="tDesc" rows="3" placeholder="কার কাছ থেকে, কবে, কীভাবে টাকা পেয়েছেন তা লিখুন"></textarea>
      <button class="btn full gold" id="submitTxnBtn">ক্যাশিয়ারের কাছে পাঠান</button>
      <div class="status-msg" id="tMsg"></div>
    </div>` : ''}

    ${rejectedMine.length? `
    <div class="card">
      <h2>ক্যাশিয়ার কর্তৃক বাতিল <small>(${rejectedMine.length}টি — সংশোধন করুন অথবা মুছে ফেলুন)</small></h2>
      <div id="rejectedMineList"></div>
    </div>` : ''}

    ${canVerify? `
    <div class="card">
      <h2>যাচাইয়ের অপেক্ষায় <small>(${pending.length}টি)</small></h2>
      <div id="pendingTxnList">${pending.length? '' : '<div class="empty">কোনো পেন্ডিং লেনদেন নেই</div>'}</div>
    </div>` : ''}

    ${canApproveWithdrawal? `
    <div class="card">
      <h2>লভ্যাংশ উত্তোলনের আবেদন <small>(${pendingWithdrawals.length}টি)</small></h2>
      <div id="withdrawalList">${pendingWithdrawals.length? '' : '<div class="empty">কোনো পেন্ডিং উত্তোলন আবেদন নেই</div>'}</div>
    </div>` : ''}

    <div class="card">
      <h2>যাচাইকৃত লেনদেন <small>(${verifiedFiltered.length}টি)</small></h2>
      <input type="text" id="txnSearch" placeholder="🔍 বিবরণ, নাম বা ধরন দিয়ে খুঁজুন" value="${searchQuery.transaction||''}" style="margin-bottom:10px;">
      <label style="font-size:12px;">সাজান</label>
      <select id="txnSort" style="margin-bottom:10px;">
        <option value="date_desc" ${sortOrder.transaction==='date_desc'?'selected':''}>তারিখ (নতুন আগে)</option>
        <option value="date_asc" ${sortOrder.transaction==='date_asc'?'selected':''}>তারিখ (পুরনো আগে)</option>
        <option value="amount_desc" ${sortOrder.transaction==='amount_desc'?'selected':''}>পরিমাণ (বেশি আগে)</option>
        <option value="amount_asc" ${sortOrder.transaction==='amount_asc'?'selected':''}>পরিমাণ (কম আগে)</option>
      </select>
      <div id="verifiedTxnList">${verifiedFiltered.length? '' : '<div class="empty">কিছু পাওয়া যায়নি</div>'}</div>
    </div>`;
  document.getElementById('txnSearch').addEventListener('input', (e)=>{ searchQuery.transaction = e.target.value; renderTab(); });
  document.getElementById('txnSort').addEventListener('change', (e)=>{ sortOrder.transaction = e.target.value; renderTab(); });
  if(txnHadFocus){ const ts = document.getElementById('txnSearch'); ts.focus(); ts.selectionStart = ts.selectionEnd = ts.value.length; }

  if(canSubmit){
    const typeSel = document.getElementById('tType');
    const investSel = document.getElementById('tInvest');
    const investHint = document.getElementById('tInvestHint');
    const syncInvestOptions = (preselectId)=>{
      const opts = txnInvestOptions_(typeSel.value);
      investSel.innerHTML = opts.length
        ? `<option value="">-- বাছাই করুন --</option>` + opts.map(iv=>`<option value="${iv['ID']}" ${String(iv['ID'])===String(preselectId)?'selected':''}>${txnInvestOptionLabel_(iv, typeSel.value)}</option>`).join('')
        : `<option value="">কোনো উপযুক্ত ইনভেস্টমেন্ট নেই</option>`;
      investHint.textContent = opts.length ? '' : 'এই ধরনের জন্য এখন কোনো ইনভেস্টমেন্ট তালিকায় নেই';
      investHint.className = 'status-msg';
    };
    typeSel.addEventListener('change', ()=>syncInvestOptions(null));

    // ইনভেস্ট ট্যাব থেকে "কিস্তি জমা সাবমিট করুন" / "প্রাপ্ত টাকা সাবমিট করুন" চেপে এলে
    // ধরন ও ইনভেস্টমেন্ট আগে থেকেই বেছে দেওয়া থাকবে
    if(prefillTxn){
      typeSel.value = prefillTxn.type;
      syncInvestOptions(prefillTxn.investId);
      prefillTxn = null;
    } else {
      syncInvestOptions(null);
    }

    document.getElementById('submitTxnBtn').addEventListener('click', async ()=>{
      const category = typeSel.value;
      const investId = investSel.value;
      const amount = document.getElementById('tAmount').value;
      const desc = document.getElementById('tDesc').value.trim();
      const msg = document.getElementById('tMsg');
      if(!investId){ msg.textContent='কোন ইনভেস্টমেন্টের সাথে সম্পর্কিত তা বাছাই করুন'; msg.className='status-msg err'; return; }
      if(amount === '' || isNaN(Number(amount)) || Number(amount)<0 || !desc){ msg.textContent='পরিমাণ (০ বা তার বেশি) ও বিস্তারিত বিবরণ দিন'; msg.className='status-msg err'; return; }
      const iv = cache.invest.find(x=>String(x['ID'])===String(investId));
      try{
        await apiPost('submitTransaction', {data:{
          'ধরন':category, 'পরিমাণ':amount, 'বিবরণ':desc,
          'ইনভেস্টমেন্ট_ID':investId, 'ইনভেস্টমেন্টের_শিরোনাম': iv? iv['শিরোনাম'] : '',
          'সাবমিটকারী_ID':session['ID'], 'সাবমিটকারীর_নাম':session['নাম'], 'সাবমিটকারীর_পদ':session['রোল']
        }});
        toast('লেনদেন ক্যাশিয়ারের কাছে পাঠানো হয়েছে');
        withRefreshThen(()=>renderTab());
      }catch(e){ msg.textContent=e.message; msg.className='status-msg err'; }
    });
  }

  if(rejectedMine.length){
    const el = document.getElementById('rejectedMineList');
    rejectedMine.forEach(t=>{
      const row = document.createElement('div'); row.className='list-item';
      row.innerHTML = `
        <div class="li-top">
          <div><div class="li-name">${t['ধরন']}</div>
          ${t['ইনভেস্টমেন্টের_শিরোনাম']? `<div class="li-meta">সংশ্লিষ্ট: ${t['ইনভেস্টমেন্টের_শিরোনাম']}</div>`:''}
          <div class="li-meta">${t['বিবরণ']}</div>
          <div class="li-meta" style="color:var(--terracotta);">বাতিলের কারণ: ${t['বাতিলের_কারণ']||''}</div></div>
          <div style="text-align:right;"><span class="amt">৳${money(t['পরিমাণ'])}</span><br><span class="badge rejected">বাতিল</span></div>
        </div>
        <div class="row-actions">
          <button class="btn small ghost" data-act="revise">সংশোধন করুন</button>
          <button class="btn small danger" data-act="del">আবেদনটি মুছে ফেলুন</button>
        </div>
        <div data-form style="display:none;margin-top:8px;">
          <label>ধরন</label>
          <select data-f="ধরন">
            <option value="${TXN_TYPE_INSTALLMENT}" ${t['ধরন']===TXN_TYPE_INSTALLMENT?'selected':''}>${TXN_TYPE_INSTALLMENT}</option>
            <option value="${TXN_TYPE_INVEST_CASH}" ${t['ধরন']===TXN_TYPE_INVEST_CASH?'selected':''}>${TXN_TYPE_INVEST_CASH}</option>
          </select>
          <label>কোন ইনভেস্টমেন্ট</label>
          <select data-f-invest></select>
          <label>পরিমাণ (৳)</label><input type="number" data-f="পরিমাণ" value="${t['পরিমাণ']}">
          <label>বিস্তারিত বিবরণ</label><textarea data-f="বিবরণ" rows="3">${t['বিবরণ']}</textarea>
          <button class="btn small gold" data-act="resubmit">সংশোধিত আবেদন আবার পাঠান</button>
        </div>`;
      const form = row.querySelector('[data-form]');
      const rTypeSel = form.querySelector('[data-f="ধরন"]');
      const rInvestSel = form.querySelector('[data-f-invest]');
      const syncRInvest = ()=>{
        const opts = txnInvestOptions_(rTypeSel.value);
        rInvestSel.innerHTML = opts.length
          ? opts.map(iv=>`<option value="${iv['ID']}" ${String(iv['ID'])===String(t['ইনভেস্টমেন্ট_ID'])?'selected':''}>${txnInvestOptionLabel_(iv, rTypeSel.value)}</option>`).join('')
          : `<option value="">কোনো উপযুক্ত ইনভেস্টমেন্ট নেই</option>`;
      };
      rTypeSel.addEventListener('change', syncRInvest);
      syncRInvest();
      row.querySelector('[data-act="revise"]').addEventListener('click', ()=>{
        form.style.display = form.style.display==='none'? 'block':'none';
      });
      row.querySelector('[data-act="del"]').addEventListener('click', async ()=>{
        if(!confirm('আবেদনটি একেবারে মুছে ফেলতে চান? এটি আর ফেরত আনা যাবে না, যেন এটি কখনো হয়ইনি।')) return;
        try{ await apiPost('deleteTransaction', {id:t['ID']}); toast('আবেদনটি মুছে ফেলা হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      row.querySelector('[data-act="resubmit"]').addEventListener('click', async ()=>{
        const category = rTypeSel.value;
        const investId = rInvestSel.value;
        const amount = form.querySelector('[data-f="পরিমাণ"]').value;
        const desc = form.querySelector('[data-f="বিবরণ"]').value.trim();
        if(!investId || !amount || !desc){ toast('সব তথ্য পূরণ করুন'); return; }
        const iv = cache.invest.find(x=>String(x['ID'])===String(investId));
        try{
          await apiPost('reviseTransaction', {id:t['ID'], data:{
            'ধরন':category,'পরিমাণ':amount,'বিবরণ':desc,
            'ইনভেস্টমেন্ট_ID':investId, 'ইনভেস্টমেন্টের_শিরোনাম': iv? iv['শিরোনাম'] : ''
          }});
          toast('সংশোধিত আবেদন আবার ক্যাশিয়ারের কাছে পাঠানো হয়েছে'); withRefreshThen(()=>renderTab());
        }catch(e){ toast(e.message); }
      });
      el.appendChild(row);
    });
  }

  if(canVerify){
    const el = document.getElementById('pendingTxnList');
    pending.forEach(t=>{
      const isValUpd = t['ধরন']==='মূল্য হালনাগাদ';
      const row = document.createElement('div'); row.className='list-item';
      row.innerHTML = `
        <div class="li-top">
          <div><div class="li-name">${t['ধরন']}</div>
          <div class="li-meta">সাবমিট: ${t['সাবমিটকারীর_নাম']} (${ROLE_LABEL[t['সাবমিটকারীর_পদ']]||t['সাবমিটকারীর_পদ']}) · ${fmtDate(t['জমার_তারিখ'])}</div>
          ${t['ইনভেস্টমেন্টের_শিরোনাম']? `<div class="li-meta">সংশ্লিষ্ট: ${t['ইনভেস্টমেন্টের_শিরোনাম']}</div>`:''}
          <div class="li-meta">${t['বিবরণ']}</div></div>
          <span class="amt">৳${money(t['পরিমাণ'])}</span>
        </div>
        <div class="row-actions">
          <button class="btn small gold" data-act="verify">${isValUpd? 'অনুমোদন করে কার্যকর করুন' : 'যাচাই করে অনুমোদন দিন'}</button>
          <button class="btn small danger" data-act="reject">বাতিল করুন</button>
        </div>
        ${isValUpd? '' : `
        <div data-rform style="display:none;margin-top:8px;">
          <label>বাতিলের কারণ</label>
          <textarea data-reason rows="2" placeholder="কেন বাতিল করছেন লিখুন — এটি সাবমিটকারীকে দেখানো হবে"></textarea>
          <button class="btn small danger" data-act="confirmReject">বাতিল নিশ্চিত করুন</button>
        </div>`}`;
      row.querySelector('[data-act="verify"]').addEventListener('click', async ()=>{
        if(isValUpd){
          if(!confirm('এই হালনাগাদ অনুমোদন করে কার্যকর করতে চান? এটি সংশ্লিষ্ট ইনভেস্টমেন্টের মূল্য/অবস্থা সরাসরি বদলে দেবে।')) return;
          try{
            await apiPost('edit', {sheet:'ইনভেস্টমেন্ট', id:t['ইনভেস্টমেন্ট_ID'], data:{
              'বর্তমান_মূল্য': t['নতুন_বর্তমান_মূল্য'], 'পরিশোধিত_টাকা': t['নতুন_পরিশোধিত_টাকা'],
              'লাভ_ক্ষতি': t['নতুন_লাভ_ক্ষতি'], 'অবস্থা': t['নতুন_অবস্থা']
            }});
            await apiPost('add', {sheet:'ইনভেস্টমেন্ট_আপডেট', data:{
              'ইনভেস্টমেন্ট_ID': t['ইনভেস্টমেন্ট_ID'], 'নোট': t['বিবরণ'],
              'সদস্য_ID': t['সাবমিটকারী_ID'], 'সদস্যের_নাম': t['সাবমিটকারীর_নাম'], 'সদস্যের_ফোন': ''
            }});
            await apiPost('deleteTransaction', {id:t['ID']});
            toast('হালনাগাদ অনুমোদিত ও কার্যকর হয়েছে'); withRefreshThen(()=>renderTab());
          }catch(e){ toast(e.message); }
          return;
        }
        if(!confirm('এই লেনদেনটি যাচাই করে কার্যকর করতে চান? এটি সংশ্লিষ্ট ইনভেস্টমেন্টের হিসাবে যোগ হয়ে যাবে।')) return;
        try{ await apiPost('verifyTransaction', {id:t['ID'], data:{'যাচাইকারী':session['নাম']}}); toast('যাচাই সম্পন্ন হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      row.querySelector('[data-act="reject"]').addEventListener('click', async ()=>{
        if(isValUpd){
          // কোনো ইতিহাস রাখা হয় না — সরাসরি মুছে ফেলা হয়, যেন অনুরোধটা কখনো হয়ইনি
          if(!confirm('এই হালনাগাদের অনুরোধ বাতিল করতে চান? এটি স্থায়ীভাবে মুছে যাবে, কোনো ইতিহাস থাকবে না।')) return;
          try{ await apiPost('deleteTransaction', {id:t['ID']}); toast('অনুরোধ বাতিল করে মুছে ফেলা হয়েছে'); withRefreshThen(()=>renderTab()); }
          catch(e){ toast(e.message); }
          return;
        }
        const f = row.querySelector('[data-rform]'); f.style.display = f.style.display==='none'? 'block':'none';
      });
      const confirmRejectBtn = row.querySelector('[data-act="confirmReject"]');
      if(confirmRejectBtn) confirmRejectBtn.addEventListener('click', async ()=>{
        const reason = row.querySelector('[data-reason]').value.trim();
        if(!reason){ toast('বাতিলের কারণ লিখুন'); return; }
        try{
          await apiPost('rejectTransaction', {id:t['ID'], data:{'যাচাইকারী':session['নাম'], 'বাতিলের_কারণ':reason}});
          toast('বাতিল করা হয়েছে, কারণসহ সাবমিটকারীর কাছে ফেরত পাঠানো হয়েছে'); withRefreshThen(()=>renderTab());
        }catch(e){ toast(e.message); }
      });
      el.appendChild(row);
    });
  }

  if(canApproveWithdrawal){
    const wEl = document.getElementById('withdrawalList');
    pendingWithdrawals.forEach(w=>{
      const row = document.createElement('div'); row.className='list-item';
      row.innerHTML = `
        <div class="li-top">
          <div><div class="li-name">${w['সদস্যের_নাম']}</div><div class="li-meta">৳${money(w['পরিমাণ'])} · ${fmtDate(w['তারিখ'])}</div></div>
        </div>
        <div class="row-actions">
          <button class="btn small gold" data-act="approveW">অনুমোদন করুন</button>
          <button class="btn small danger" data-act="rejectW">বাতিল করুন</button>
        </div>`;
      row.querySelector('[data-act="approveW"]').addEventListener('click', async ()=>{
        if(!confirm(w['সদস্যের_নাম']+'-কে ৳'+money(w['পরিমাণ'])+' হাতে বুঝিয়ে দিয়েছেন তো?')) return;
        try{ await apiPost('approveWithdrawal', {id:w['ID']}); toast('উত্তোলন অনুমোদিত হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      row.querySelector('[data-act="rejectW"]').addEventListener('click', async ()=>{
        try{ await apiPost('rejectWithdrawal', {id:w['ID']}); toast('বাতিল করা হয়েছে'); withRefreshThen(()=>renderTab()); }
        catch(e){ toast(e.message); }
      });
      wEl.appendChild(row);
    });
  }

  const vEl = document.getElementById('verifiedTxnList');
  verifiedFiltered.slice(0,30).forEach(t=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${t['ধরন']}</div>
        <div class="li-meta">সাবমিট: ${t['সাবমিটকারীর_নাম']} (${ROLE_LABEL[t['সাবমিটকারীর_পদ']]||t['সাবমিটকারীর_পদ']}) · যাচাই: ${t['যাচাইকারী']||''} · ${fmtDate(t['যাচাইয়ের_তারিখ'])}</div>
        ${t['ইনভেস্টমেন্টের_শিরোনাম']? `<div class="li-meta">সংশ্লিষ্ট: ${t['ইনভেস্টমেন্টের_শিরোনাম']}</div>`:''}
        <div class="li-meta">${t['বিবরণ']}</div></div>
        <span class="amt pos">৳${money(t['পরিমাণ'])} <span class="stamp">✓ ভেরিফাইড</span></span>
      </div>`;
    vEl.appendChild(row);
  });
}

/* ---------------- SHARED: "মোট জমা" চিপ থেকে — সদস্যভিত্তিক জমার সারাংশ ----------------
   ভেরিফাইড চাঁদা সদস্য অনুযায়ী যোগ করে বেশি জমাদাতা থেকে সাজিয়ে দেখানো হয়।
   কোনো সদস্যের রো ট্যাপ করলে তার জমার সম্পূর্ণ ইতিহাস (তারিখ, মাধ্যম, স্ট্যাটাসসহ) খুলে যায়। */
function renderContribSummary(main){
  const byMember = {};
  cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড').forEach(c=>{
    const id = c['সদস্য_ID'];
    if(!byMember[id]) byMember[id] = {name:c['সদস্যের_নাম'], total:0};
    byMember[id].total += Number(c['পরিমাণ']||0);
  });
  const rows = Object.entries(byMember).map(([id,v])=>({id, name:v.name, total:v.total})).sort((a,b)=>b.total-a.total);
  const totalContrib = rows.reduce((s,r)=>s+r.total,0);

  main.innerHTML = `
    <div class="summary-bar">
      <div class="summary-chip"><div class="lbl">মোট জমা</div><div class="val">৳${money(totalContrib)}</div></div>
      <div class="summary-chip"><div class="lbl">জমাদাতা সদস্য</div><div class="val">${money(rows.length)}</div></div>
    </div>
    <div class="card">
      <h2>সদস্যভিত্তিক মোট জমা</h2>
      <div class="li-meta" style="margin-bottom:4px;">যেকোনো সদস্যের নামে ট্যাপ করলে তার জমার বিস্তারিত ইতিহাস দেখা যাবে</div>
      <div id="contribByMember">${rows.length? '' : '<div class="empty">এখনো কোনো ভেরিফাইড চাঁদা নেই</div>'}</div>
    </div>`;

  const el = document.getElementById('contribByMember');
  rows.forEach(r=>{
    const history = cache.contrib.filter(c=>String(c['সদস্য_ID'])===String(r.id))
      .sort((a,b)=>String(b['জমার_তারিখ']).localeCompare(String(a['জমার_তারিখ'])));
    const wrap = document.createElement('div');
    wrap.innerHTML = `
      <div class="list-item" data-act="toggleHead" style="cursor:pointer;padding-bottom:8px;">
        <div class="li-top">
          <div class="li-name">${r.name}</div>
          <span class="amt pos">৳${money(r.total)}</span>
        </div>
        <div class="li-meta" style="margin-top:4px;color:var(--muted);">বিস্তারিত দেখতে ট্যাপ করুন <span data-act="toggleArrow">▾</span></div>
      </div>
      <div data-act="detailWrap" style="display:none;margin:-6px 0 8px 4px;padding-bottom:6px;border-bottom:1px dashed var(--rule);"></div>`;
    const detailWrap = wrap.querySelector('[data-act="detailWrap"]');
    if(!history.length){
      detailWrap.innerHTML = '<div class="empty">কোনো এন্ট্রি নেই</div>';
    } else {
      history.forEach(c=>{
        const isV = c['স্ট্যাটাস']==='ভেরিফাইড';
        const isR = c['স্ট্যাটাস']==='বাতিল';
        const hrow = document.createElement('div');
        hrow.innerHTML = `
          <div class="li-top" style="padding:5px 0;">
            <div><div class="li-name" style="font-size:13px;">${c['মাস']}</div><div class="li-meta">${c['মাধ্যম']||''} · ${fmtDate(c['জমার_তারিখ'])}</div></div>
            <div style="text-align:right;">
              <div class="amt ${isV?'pos':''}" style="font-size:13px;">৳${money(c['পরিমাণ'])}</div>
              <span class="badge ${isV?'verified':(isR?'rejected':'pending')}">${c['স্ট্যাটাস']}</span>
            </div>
          </div>`;
        detailWrap.appendChild(hrow);
      });
    }
    wrap.querySelector('[data-act="toggleHead"]').addEventListener('click', ()=>{
      const open = detailWrap.style.display !== 'none';
      detailWrap.style.display = open ? 'none' : 'block';
      wrap.querySelector('[data-act="toggleArrow"]').textContent = open ? '▾' : '▴';
    });
    el.appendChild(wrap);
  });
}

/* ---------------- SHARED: "লাভ/ক্ষতি" চিপ থেকে — এন্ট্রি-ভিত্তিক লাভ-ক্ষতির বিবরণ ----------------
   'ধরন' অনুযায়ী যোগফল না দেখিয়ে প্রতিটা ইনভেস্টমেন্ট এন্ট্রি আলাদাভাবে দেখানো হয়
   (শিরোনাম-সহ, যাতে বোঝা যায় ঠিক কোনটার লাভ/ক্ষতি — কার ছাগল, কোন গ্রাহকের বাকি
   বিক্রয় ইত্যাদি)। যেকোনো এন্ট্রিতে ট্যাপ করলে সাথে সাথে ইনভেস্ট ট্যাবে সেই
   নির্দিষ্ট এন্ট্রিটার বিস্তারিত অংশ খুলে দেখানো হয়। */
function renderProfitLossDetail(main){
  const rows = cache.invest.map(iv=>({
    id: iv['ID'], title: iv['শিরোনাম'], type: iv['ধরন'], pl: Number(iv['লাভ_ক্ষতি']||0)
  }));
  const profits = rows.filter(r=>r.pl>=0).sort((a,b)=>b.pl-a.pl);
  const losses = rows.filter(r=>r.pl<0).sort((a,b)=>a.pl-b.pl);
  const totalProfit = profits.reduce((s,r)=>s+r.pl,0);
  const totalLoss = losses.reduce((s,r)=>s+r.pl,0);
  const totalPL = totalProfit + totalLoss;

  main.innerHTML = `
    <div class="summary-bar">
      <div class="summary-chip"><div class="lbl">মোট লাভ/ক্ষতি</div><div class="val" style="color:${totalPL>=0?'var(--sage)':'var(--terracotta)'}">৳${money(totalPL)}</div></div>
      <div class="summary-chip"><div class="lbl">মোট লাভ</div><div class="val" style="color:var(--sage)">৳${money(totalProfit)}</div></div>
      <div class="summary-chip"><div class="lbl">মোট ক্ষতি</div><div class="val" style="color:var(--terracotta)">৳${money(Math.abs(totalLoss))}</div></div>
    </div>
    <div class="card">
      <h2>এন্ট্রিভিত্তিক লাভ/ক্ষতি</h2>
      <div class="li-meta" style="margin-bottom:6px;">যেকোনো এন্ট্রিতে ট্যাপ করলে সরাসরি সেই ইনভেস্টমেন্টের বিস্তারিত দেখাবে</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <div>
          <div style="font-weight:700;color:var(--sage);font-size:13px;margin-bottom:6px;">লাভ</div>
          <div id="plProfitList">${profits.length? '' : '<div class="empty">কোনো লাভজনক এন্ট্রি নেই</div>'}</div>
        </div>
        <div>
          <div style="font-weight:700;color:var(--terracotta);font-size:13px;margin-bottom:6px;">ক্ষতি</div>
          <div id="plLossList">${losses.length? '' : '<div class="empty">কোনো ক্ষতিগ্রস্ত এন্ট্রি নেই</div>'}</div>
        </div>
      </div>
    </div>`;

  const goToInvest = (id)=>{ focusInvestId = id; activeTab = 'invest'; renderShell(); };

  const pList = document.getElementById('plProfitList');
  profits.forEach(r=>{
    const item = document.createElement('div'); item.className='list-item'; item.style.cssText='padding:8px 0;cursor:pointer;';
    item.innerHTML = `
      <div class="li-name" style="font-size:12.5px;">${r.title}</div>
      <div class="li-meta" style="margin-bottom:2px;">${r.type}</div>
      <div class="amt pos" style="font-size:13.5px;">৳${money(r.pl)}</div>`;
    item.addEventListener('click', ()=>goToInvest(r.id));
    pList.appendChild(item);
  });
  const lList = document.getElementById('plLossList');
  losses.forEach(r=>{
    const item = document.createElement('div'); item.className='list-item'; item.style.cssText='padding:8px 0;cursor:pointer;';
    item.innerHTML = `
      <div class="li-name" style="font-size:12.5px;">${r.title}</div>
      <div class="li-meta" style="margin-bottom:2px;">${r.type}</div>
      <div class="amt neg" style="font-size:13.5px;">৳${money(r.pl)}</div>`;
    item.addEventListener('click', ()=>goToInvest(r.id));
    lList.appendChild(item);
  });
}

/* ---------------- SHARED: "হ্যান্ড ক্যাশ" চিপ থেকে — হ্যান্ড ক্যাশের সম্পূর্ণ হিসাব ----------------
   হ্যান্ড ক্যাশ = ভেরিফাইড চাঁদা − খরচ − ইনভেস্টমেন্টে দেওয়া টাকা + ইনভেস্টমেন্ট থেকে ফেরত আসা টাকা।
   এই চারটা উপাদানের প্রতিটার আলাদা আলাদা আইটেম-ভিত্তিক তালিকা এখানে দেখানো হয়। */
function renderHandCash(main){
  const verified = cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড')
    .sort((a,b)=>String(b['জমার_তারিখ']).localeCompare(String(a['জমার_তারিখ'])));
  const totalContrib = verified.reduce((s,c)=>s+Number(c['পরিমাণ']||0),0);
  const expenses = [...cache.expense].sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
  const totalExpense = expenses.reduce((s,x)=>s+Number(x['পরিমাণ']||0),0);
  const invests = [...cache.invest].filter(i=>i['অবস্থা']!=='অনুমোদনের অপেক্ষায়' && i['অবস্থা']!=='প্রত্যাখ্যাত').sort((a,b)=>String(b['শুরুর_তারিখ']).localeCompare(String(a['শুরুর_তারিখ'])));
  const totalInvest = invests.reduce((s,i)=>s+Number(i['বিনিয়োগ_টাকা']||0),0);
  const cashBackList = invests.filter(i=>Number(i['পরিশোধিত_টাকা']||0) > 0);
  const totalCashReturned = invests.reduce((s,i)=>s+Number(i['পরিশোধিত_টাকা']||0),0);
  const withdrawals = cache.withdrawal.filter(w=>w['স্ট্যাটাস']==='অনুমোদিত').sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
  const totalWithdrawn = withdrawals.reduce((s,w)=>s+Number(w['পরিমাণ']||0),0);
  const handCash = totalContrib - totalExpense - totalInvest + totalCashReturned - totalWithdrawn;

  main.innerHTML = `
    <div class="card">
      <h2>হ্যান্ড ক্যাশের হিসাব</h2>
      <div class="li-meta">সমিতির হাতে এই মুহূর্তে থাকা নগদ টাকার হিসাব নিচের অংশগুলো মিলিয়ে বের হয়েছে</div>
      <div style="margin-top:10px;font-size:13.5px;line-height:2.1;">
        <div>➕ সদস্যদের মোট টাকা &nbsp; <b class="amt pos">৳${money(totalContrib)}</b></div>
        <div>➖ খরচ &nbsp; <b class="amt neg">৳${money(totalExpense)}</b></div>
        <div>➖ ইনভেস্টমেন্টে দেওয়া টাকা &nbsp; <b class="amt neg">৳${money(totalInvest)}</b></div>
        <div>➕ ইনভেস্টমেন্ট থেকে ফেরত আসা টাকা &nbsp; <b class="amt pos">৳${money(totalCashReturned)}</b></div>
        <div>➖ সদস্যদের লভ্যাংশ উত্তোলন &nbsp; <b class="amt neg">৳${money(totalWithdrawn)}</b></div>
        <div style="border-top:1px solid var(--rule);margin-top:6px;padding-top:8px;">
          = হ্যান্ড ক্যাশ &nbsp; <b class="amt ${handCash>=0?'pos':'neg'}" style="font-size:17px;">৳${money(handCash)}</b>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>সদস্যদের লভ্যাংশ উত্তোলন <small>(মোট ৳${money(totalWithdrawn)})</small></h2>
      <div id="hcWithdrawalList">${withdrawals.length? '' : '<div class="empty">কোনো উত্তোলন হয়নি</div>'}</div>
    </div>
    <div class="card">
      <h2>সদস্যদের মোট টাকা <small>(মোট ৳${money(totalContrib)})</small></h2>
      <div id="hcContribList">${verified.length? '' : '<div class="empty">কোনো এন্ট্রি নেই</div>'}</div>
    </div>
    <div class="card">
      <h2>খরচ <small>(মোট ৳${money(totalExpense)})</small></h2>
      <div id="hcExpenseList">${expenses.length? '' : '<div class="empty">কোনো এন্ট্রি নেই</div>'}</div>
    </div>
    <div class="card">
      <h2>ইনভেস্টমেন্টে দেওয়া টাকা <small>(মোট ৳${money(totalInvest)})</small></h2>
      <div id="hcInvestList">${invests.length? '' : '<div class="empty">কোনো এন্ট্রি নেই</div>'}</div>
    </div>
    <div class="card">
      <h2>ইনভেস্টমেন্ট থেকে ফেরত আসা টাকা <small>(মোট ৳${money(totalCashReturned)})</small></h2>
      <div id="hcCashbackList">${cashBackList.length? '' : '<div class="empty">এখনো কোনো টাকা ফেরত আসেনি</div>'}</div>
    </div>`;

  const cList = document.getElementById('hcContribList');
  verified.forEach(c=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${c['সদস্যের_নাম']}</div><div class="li-meta">${c['মাস']} · ${fmtDate(c['জমার_তারিখ'])}</div></div>
        <span class="amt pos">৳${money(c['পরিমাণ'])}</span>
      </div>`;
    cList.appendChild(row);
  });
  const eList = document.getElementById('hcExpenseList');
  expenses.forEach(x=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${x['শিরোনাম']}</div><div class="li-meta">${fmtDate(x['তারিখ'])} · ${x['এন্ট্রিকারী']||''}</div></div>
        <span class="amt neg">-৳${money(x['পরিমাণ'])}</span>
      </div>`;
    eList.appendChild(row);
  });
  const iList = document.getElementById('hcInvestList');
  invests.forEach(iv=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${iv['শিরোনাম']}</div><div class="li-meta">${iv['ধরন']} · ${fmtDate(iv['শুরুর_তারিখ'])}</div></div>
        <span class="amt neg">-৳${money(iv['বিনিয়োগ_টাকা'])}</span>
      </div>`;
    iList.appendChild(row);
  });
  const cbList = document.getElementById('hcCashbackList');
  cashBackList.forEach(iv=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${iv['শিরোনাম']}</div><div class="li-meta">${iv['ধরন']}</div></div>
        <span class="amt pos">৳${money(iv['পরিশোধিত_টাকা'])}</span>
      </div>`;
    cbList.appendChild(row);
  });
  const wList = document.getElementById('hcWithdrawalList');
  withdrawals.forEach(w=>{
    const row = document.createElement('div'); row.className='list-item';
    row.innerHTML = `
      <div class="li-top">
        <div><div class="li-name">${w['সদস্যের_নাম']}</div><div class="li-meta">${fmtDate(w['তারিখ'])} · অনুমোদন: ${w['অনুমোদনকারী']||''}</div></div>

      </div>${x['বিবরণ']?`<div class="li-meta" style="margin-top:4px;">${x['বিবরণ']}</div>`:''}`;
    el.appendChild(row);
  });
}

      <label>বিবরণ (ঐচ্ছিক)</label>
      <textarea id="ivNote" rows="2"></textarea>
      <div style="border-top:1px dashed var(--rule);margin-top:10px;padding-top:10px;">
        <label>লাভ/ক্ষতি বণ্টনে অংশগ্রহণকারী সদস্য</label>
        <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">প্রতিটা সদস্যের চাঁদার অনুপাতে এই ইনভেস্টমেন্টের লাভ/ক্ষতির ভাগ নির্ধারিত হবে (তৈরির মুহূর্তের চাঁদার হিসাব অনুযায়ী)। চাইলে কাউকে বাদ দিতে আনচেক করুন — বাকিদের হিসাবে তার ভাগটা স্বয়ংক্রিয়ভাবে ভাগ হয়ে যাবে।</p>

      <div id="pendingInvestList">${pendingInvests.length? '' : '<div class="empty">কোনো পেন্ডিং আবেদন নেই</div>'}</div>
    </div>` : ''}
    <div class="card"><h2>ইনভেস্টমেন্টের তালিকা <small>(${listFiltered.length}টি)</small></h2>
      <input type="text" id="invSearch" placeholder="🔍 শিরোনাম, গ্রাহক, ধরন বা অবস্থা দিয়ে খুঁজুন" value="${searchQuery.invest||''}" style="margin-bottom:10px;">
      <label style="font-size:12px;">সাজান</label>
      <select id="invSort" style="margin-bottom:10px;">
        <option value="updated" ${sortOrder.invest==='updated'?'selected':''}>সর্বশেষ আপডেট (ডিফল্ট)</option>
        <option value="amount_desc" ${sortOrder.invest==='amount_desc'?'selected':''}>বিনিয়োগ (বেশি আগে)</option>
        <option value="amount_asc" ${sortOrder.invest==='amount_asc'?'selected':''}>বিনিয়োগ (কম আগে)</option>
        <option value="pl_desc" ${sortOrder.invest==='pl_desc'?'selected':''}>লাভ-ক্ষতি (বেশি লাভ আগে)</option>
        <option value="pl_asc" ${sortOrder.invest==='pl_asc'?'selected':''}>লাভ-ক্ষতি (বেশি ক্ষতি আগে)</option>
        <option value="start_desc" ${sortOrder.invest==='start_desc'?'selected':''}>শুরুর তারিখ (নতুন আগে)</option>
        <option value="start_asc" ${sortOrder.invest==='start_asc'?'selected':''}>শুরুর তারিখ (পুরনো আগে)</option>
      </select>

  document.getElementById('invSearch').addEventListener('input', (e)=>{ searchQuery.invest = e.target.value; renderTab(); });
  document.getElementById('invSort').addEventListener('change', (e)=>{ sortOrder.invest = e.target.value; renderTab(); });
  if(ivHadFocus){ const is_ = document.getElementById('invSearch'); is_.focus(); is_.selectionStart = is_.selectionEnd = is_.value.length; }

  if(canManage){
    const approvedForDist = cache.users.filter(u=>u['স্ট্যাটাস']==='অনুমোদিত');
    const memberCheckEl = document.getElementById('ivMemberCheckList');
    const contribTotals = {};
    approvedForDist.forEach(u=>{ contribTotals[u['ID']] = 0; });
    cache.contrib.filter(c=>c['স্ট্যাটাস']==='ভেরিফাইড').forEach(c=>{
      if(contribTotals.hasOwnProperty(c['সদস্য_ID'])) contribTotals[c['সদস্য_ID']] += Number(c['পরিমাণ']||0);
    });
    memberCheckEl.innerHTML = approvedForDist.length ? approvedForDist.map(u=>`
      <label style="display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px;">
        <input type="checkbox" class="ivMemberChk" data-uid="${u['ID']}" checked> ${u['নাম']} <span class="li-meta">(@${u['ইউজারনেম']})</span>
        <span class="ivMemberPct" data-uid="${u['ID']}" style="margin-left:auto;font-weight:700;color:var(--brand,#0f4c3a);"></span>
      </label>`).join('') : '<div class="empty">কোনো অনুমোদিত সদস্য নেই</div>';
    const updateMemberPct_ = ()=>{
      const checks = Array.from(document.querySelectorAll('.ivMemberChk'));
      const checkedIds = checks.filter(c=>c.checked).map(c=>c.dataset.uid);
      const grandTotal = checkedIds.reduce((s,id)=>s+(contribTotals[id]||0), 0);
      checks.forEach(c=>{
        const pctEl = document.querySelector('.ivMemberPct[data-uid="'+c.dataset.uid+'"]');
        if(!pctEl) return;
        if(!c.checked){ pctEl.textContent = 'বাদ'; pctEl.style.color = '#999'; return; }
        const amt = contribTotals[c.dataset.uid] || 0;
        const pct = grandTotal>0 ? (amt/grandTotal*100) : (checkedIds.length ? 100/checkedIds.length : 0);
        pctEl.textContent = pct.toFixed(1)+'%';
        pctEl.style.color = 'var(--brand,#0f4c3a)';
      });
    };
    updateMemberPct_();
    memberCheckEl.querySelectorAll('.ivMemberChk').forEach(chk=> chk.addEventListener('change', updateMemberPct_));

    const typeSel = document.getElementById('ivType');
    const otherWrap = document.getElementById('ivOtherWrap');
    const saleWrap = document.getElementById('ivSaleWrap');
    const amtLabel = document.getElementById('ivAmtLabel');
    const salePriceEl = document.getElementById('ivSalePrice');
    const amtEl = document.getElementById('ivAmt');
    const profitHint = document.getElementById('ivProfitHint');
    const syncType = ()=>{
      const isSale = typeSel.value === SALE_TYPE;
      otherWrap.style.display = typeSel.value === 'অন্যান্য' ? '' : 'none';
      saleWrap.style.display = isSale ? '' : 'none';
      amtLabel.textContent = isSale ? 'ক্রয়মূল্য (৳)' : 'বিনিয়োগ (৳)';
    };
    typeSel.addEventListener('change', syncType);
    const updateProfitHint = ()=>{
      const profit = (Number(salePriceEl.value)||0) - (Number(amtEl.value)||0);
      profitHint.textContent = 'লাভ: ৳' + money(profit);
      profitHint.style.color = profit>=0 ? 'var(--sage)' : 'var(--terracotta)';
    };
    amtEl.addEventListener('input', updateProfitHint);
    salePriceEl.addEventListener('input', updateProfitHint);

    const proofFile = document.getElementById('ivProofFile');
    const proofPreviewWrap = document.getElementById('ivProofPreviewWrap');
    proofFile.addEventListener('change', ()=>{
      proofPreviewWrap.innerHTML = '';
      Array.from(proofFile.files).forEach(f=>{
        const reader = new FileReader();
        reader.onload = e=>{
          const img = document.createElement('img');
          img.src = e.target.result;
          img.style.cssText = 'width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);';
          proofPreviewWrap.appendChild(img);
        };
        reader.readAsDataURL(f);
      });
    });
    document.getElementById('addIvBtn').addEventListener('click', async ()=>{
      const title = document.getElementById('ivTitle').value.trim();
      let type = typeSel.value;
      const isSale = type === SALE_TYPE;
      const amt = amtEl.value;
      const date = document.getElementById('ivDate').value;
      const note = document.getElementById('ivNote').value.trim();
      const msg = document.getElementById('ivMsg');
      if(type === 'অন্যান্য'){
        const custom = document.getElementById('ivOtherType').value.trim();
        if(!custom){ msg.textContent='ধরন লিখুন'; msg.className='status-msg err'; return; }
        type = custom;
      }
      if(!title || !amt){ msg.textContent='শিরোনাম ও বিনিয়োগের পরিমাণ দিন'; msg.className='status-msg err'; return; }
      const extra = {};
      if(isSale){
        const salePrice = salePriceEl.value;
        const custName = document.getElementById('ivCustName').value.trim();
        if(!salePrice || !custName){ msg.textContent='বিক্রয়মূল্য ও গ্রাহকের নাম দিন'; msg.className='status-msg err'; return; }
        if(Number(salePrice) < Number(amt)){ msg.textContent='বিক্রয়মূল্য ক্রয়মূল্যের চেয়ে কম হতে পারে না'; msg.className='status-msg err'; return; }
        extra['বিক্রয়মূল্য'] = salePrice;
        extra['গ্রাহকের_নাম'] = custName;
        extra['গ্রাহকের_ফোন'] = document.getElementById('ivCustPhone').value.trim();
        extra['গ্রাহকের_ঠিকানা'] = document.getElementById('ivCustAddr').value.trim();
        extra['মোট_কিস্তি'] = document.getElementById('ivInstCount').value || 1;
      }
      const excludedIds = Array.from(document.querySelectorAll('.ivMemberChk:not(:checked)')).map(el=>el.dataset.uid);
      try{
        const proofUrls = await uploadMultiplePhotos_(proofFile.files, title||'investment', msg);
        await apiPost('addInvestment', {data: Object.assign({
          'শিরোনাম':title,'ধরন':type,'বিনিয়োগ_টাকা':amt,
          'শুরুর_তারিখ':date,'পরিচালক':session['নাম'],'প্রমাণ_লিংক':proofUrls.join(','),'বিবরণ':note,

              ${u['নোট']?`<div style="font-size:13px;margin-top:3px;">${u['নোট']}</div>`:''}
              ${uPhotos.length? `<div class="row-actions">${uPhotos.map(p=>`<img src="${p}" alt="ছবি" data-proof-url="${p}" style="max-width:70px;max-height:70px;border-radius:7px;cursor:pointer;object-fit:cover;border:1px solid var(--rule);">`).join('')}</div>`:''}
            </div>`;
          }).join('')}
        </div>
      </div>`;

    const detailWrap = row.querySelector('[data-act="detailWrap"]');
    const toggleArrow = row.querySelector('[data-act="toggleArrow"]');
    const toggleHint = row.querySelector('[data-act="toggleHint"]');
    const toggleDetail = ()=>{
      const willShow = detailWrap.style.display === 'none';
      detailWrap.style.display = willShow ? '' : 'none';
      toggleArrow.textContent = willShow ? '▴' : '▾';
      toggleHint.firstChild.textContent = willShow ? 'বিস্তারিত লুকান ' : 'বিস্তারিত দেখতে ট্যাপ করুন ';
    };
    row.querySelector('[data-act="toggleHead"]').addEventListener('click', toggleDetail);
    toggleHint.addEventListener('click', toggleDetail);

    row.querySelectorAll('[data-proof-url]').forEach(img=>{
      img.addEventListener('click', (ev)=>{ ev.stopPropagation(); window.open(img.getAttribute('data-proof-url'),'_blank'); });
    });

    const valUpdToggleBtn = row.querySelector('[data-act="valUpdToggle"]');
    const valUpdForm = row.querySelector('[data-act="valUpdForm"]');
    if(valUpdToggleBtn) valUpdToggleBtn.addEventListener('click', ()=>{
      valUpdForm.style.display = valUpdForm.style.display==='none' ? '' : 'none';
    });
    if(valUpdForm){
      const kindSel = row.querySelector('[data-act="valUpdKind"]');
      const amtLabel = row.querySelector('[data-act="valUpdAmtLabel"]');
      const amtInput = row.querySelector('[data-act="valUpdAmt"]');
      const hint = row.querySelector('[data-act="valUpdHint"]');
      const HINTS = {
        reval:   'নতুন বর্তমান বাজারমূল্য কত, তা লিখুন (আগের মূল্যের বদলে সরাসরি নতুন মূল্য বসবে)।',
        dividend:'হাতে নগদ যে লভ্যাংশ এসেছে সেটা লিখুন — এটা হ্যান্ড ক্যাশে যোগ হবে, বিনিয়োগের মূল্য অপরিবর্তিত থাকবে।',
        loss:    'ব্যবসা সম্পূর্ণ বন্ধ/লোকসানে গেলে এখানে ব্যবহার করুন। যদি কিছু টাকা উদ্ধার হয় সেটা লিখুন, না হলে ০ রাখুন।',
        grow:    'বাচ্চা জন্ম নেওয়া বা ওজন/আকারে বেড়ে যাওয়ায় মূল্য যতটা বেড়েছে সেটা লিখুন — বর্তমান মূল্যের সাথে যোগ হবে।',
        loss_partial: 'অসুস্থতা/আঘাত ইত্যাদির কারণে মূল্য যতটা কমেছে সেটা লিখুন — বর্তমান মূল্য থেকে বিয়োগ হবে।',
        sold:    'বিক্রি করে যা নগদ পাওয়া গেছে সেটা লিখুন — এই টাকা হ্যান্ড ক্যাশে যোগ হবে এবং ইনভেস্টমেন্টটা সমাপ্ত হবে।',
        died:    'মারা গেলে এখানে ব্যবহার করুন। মাংস/চামড়া ইত্যাদি বিক্রি করে কিছু টাকা উদ্ধার হলে সেটা লিখুন, না হলে ০ রাখুন।'
      };
      const AMT_LABELS = {
        reval:'নতুন বর্তমান মূল্য (৳)', dividend:'লভ্যাংশের পরিমাণ (৳)', loss:'উদ্ধারকৃত টাকা (৳, না থাকলে ০)',
        grow:'মূল্য কত বেড়েছে (৳)', loss_partial:'মূল্য কত কমেছে (৳)', sold:'বিক্রয়মূল্য — নগদ প্রাপ্তি (৳)',
        died:'উদ্ধারকৃত টাকা (৳, না থাকলে ০)'
      };
      const syncKind = ()=>{
        const k = kindSel.value;
        hint.textContent = HINTS[k] || '';
        amtLabel.textContent = AMT_LABELS[k] || 'পরিমাণ (৳)';
        amtInput.value = k==='reval' ? Number(iv['বর্তমান_মূল্য']||0) : 0;
      };
      kindSel.addEventListener('change', syncKind);
      syncKind();

      row.querySelector('[data-act="valUpdSubmit"]').addEventListener('click', async ()=>{
        const kind = kindSel.value;
        const amount = Number(amtInput.value||0);
        const userNote = row.querySelector('[data-act="valUpdNote"]').value.trim();
        const msg = row.querySelector('[data-act="valUpdMsg"]');
        if(kind==='reval' && amount<0){ msg.textContent='সঠিক মূল্য দিন'; msg.className='status-msg err'; return; }
        if(kind!=='reval' && kind!=='dividend' && amount<0){ msg.textContent='সঠিক পরিমাণ দিন'; msg.className='status-msg err'; return; }

        const curVal = Number(iv['বর্তমান_মূল্য']||0);
        const curPaid = Number(iv['পরিশোধিত_টাকা']||0);
        const invested = Number(iv['বিনিয়োগ_টাকা']||0);
        let newVal = curVal, newPaid = curPaid, newStatus = iv['অবস্থা'], autoNote = '';
        switch(kind){
          case 'reval':
            newVal = amount; autoNote = `মূল্য পুনর্মূল্যায়ন: ৳${money(curVal)} → ৳${money(amount)}`; break;
          case 'dividend':
            newPaid = curPaid + amount; autoNote = `নগদ লভ্যাংশ গৃহীত: ৳${money(amount)}`; break;
          case 'loss':
            newVal = amount; newStatus = 'সমাপ্ত'; autoNote = `সম্পূর্ণ ক্ষতি — ইনভেস্টমেন্ট সমাপ্ত।${amount>0?' উদ্ধারকৃত: ৳'+money(amount):''}`; break;
          case 'grow':
            newVal = curVal + amount; autoNote = `বৃদ্ধি পেয়েছে: +৳${money(amount)}`; break;
          case 'loss_partial':
            newVal = Math.max(0, curVal - amount); autoNote = `আংশিক ক্ষতি: -৳${money(amount)}`; break;
          case 'sold':
            newVal = 0; newPaid = curPaid + amount;
            if(activeBabies.length > 0){
              // মা বিক্রি হলেও তার সক্রিয় বাচ্চা থেকে গেলে ইনভেস্টমেন্টটা বন্ধ না
              // করে বাচ্চাগুলোর নামেই চলমান রাখা হয় (বাচ্চার ক্রয়মূল্য ০ ধরে)
              newStatus = 'চলমান';
              autoNote = `মা বিক্রি সম্পন্ন — নগদ ফেরত: ৳${money(amount)}। ${activeBabies.length}টা বাচ্চা এখনো সক্রিয় থাকায় ইনভেস্টমেন্টটা বাচ্চাদের নামে চলমান থাকবে (বাচ্চার ক্রয়মূল্য ০ ধরা হয়েছে)।`;
            } else {
              newStatus = 'সমাপ্ত'; autoNote = `বিক্রি সম্পন্ন — নগদ ফেরত: ৳${money(amount)}`;
            }
            break;
          case 'died':
            newVal = 0; newPaid = curPaid + amount; newStatus = 'সমাপ্ত'; autoNote = `মারা গেছে — ইনভেস্টমেন্ট সমাপ্ত।${amount>0?' উদ্ধারকৃত: ৳'+money(amount):''}`; break;
        }
        const newPL = (newVal + newPaid) - invested;
        const fullNote = userNote ? (autoNote + ' — ' + userNote) : autoNote;
        try{
          await apiPost('submitTransaction', {data:{
            'ধরন': 'মূল্য হালনাগাদ', 'পরিমাণ': amount, 'বিবরণ': fullNote,
            'ইনভেস্টমেন্ট_ID': iv['ID'], 'ইনভেস্টমেন্টের_শিরোনাম': iv['শিরোনাম'],
            'হালনাগাদ_ধরন': kind,
            'নতুন_বর্তমান_মূল্য': newVal, 'নতুন_পরিশোধিত_টাকা': newPaid,
            'নতুন_অবস্থা': newStatus, 'নতুন_লাভ_ক্ষতি': newPL,
            'সাবমিটকারী_ID':session['ID'], 'সাবমিটকারীর_নাম':session['নাম'], 'সাবমিটকারীর_পদ':session['রোল']
          }});
          toast('হালনাগাদের অনুরোধ ক্যাশিয়ারের কাছে পাঠানো হয়েছে — অনুমোদনের পর কার্যকর হবে');
          withRefreshThen(()=>renderTab());
        }catch(e){ msg.textContent = e.message; msg.className='status-msg err'; }
      });
    }

    /* ---------------- বাচ্চা (offspring) সেকশন ---------------- */
    const babyAddToggleBtn = row.querySelector('[data-act="babyAddToggle"]');
    const babyAddForm = row.querySelector('[data-act="babyAddForm"]');
    if(babyAddToggleBtn) babyAddToggleBtn.addEventListener('click', ()=>{
      babyAddForm.style.display = babyAddForm.style.display==='none' ? '' : 'none';
    });
    const babyAddFile = row.querySelector('[data-act="babyAddFile"]');
    const babyAddPreview = row.querySelector('[data-act="babyAddPreview"]');
    if(babyAddFile) babyAddFile.addEventListener('change', ()=>{
      babyAddPreview.innerHTML = '';
      Array.from(babyAddFile.files).forEach(f=>{
        const reader = new FileReader();
        reader.onload = e=>{
          const img = document.createElement('img');
          img.src = e.target.result;
          img.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);';
          babyAddPreview.appendChild(img);
        };
        reader.readAsDataURL(f);
      });
    });
    const babyAddSubmitBtn = row.querySelector('[data-act="babyAddSubmit"]');
    if(babyAddSubmitBtn) babyAddSubmitBtn.addEventListener('click', async ()=>{
      const countN = Math.max(1, Number(row.querySelector('[data-act="babyAddCount"]').value||1));
      const gender = row.querySelector('[data-act="babyAddGender"]').value;
      const note = row.querySelector('[data-act="babyAddNote"]').value.trim();
      const msg = row.querySelector('[data-act="babyAddMsg"]');
      try{
        const urls = await uploadMultiplePhotos_(babyAddFile.files, (iv['শিরোনাম']||'baby')+'_baby', msg);
        const photoStr = urls.join(',');
        let startSeq = allBabiesOfInvest.length;
        for(let i=0;i<countN;i++){
          startSeq += 1;
          await apiPost('add', {sheet:'বাচ্চা', data:{
            'ইনভেস্টমেন্ট_ID': iv['ID'], 'ক্রম': startSeq, 'লিঙ্গ': gender,
            'ছবি_লিংক': photoStr, 'নোট': note, 'অবস্থা': 'সক্রিয়'
          }});
        }
        await apiPost('edit', {sheet:'ইনভেস্টমেন্ট', id:iv['ID'], data:{
          'বাচ্চা_সংখ্যা': babyCount + countN
        }});
        await apiPost('add', {sheet:'ইনভেস্টমেন্ট_আপডেট', data:{
          'ইনভেস্টমেন্ট_ID': iv['ID'], 'নোট': `${countN}টা বাচ্চা যুক্ত হয়েছে${note?' — '+note:''}`,
          'সদস্য_ID': session['ID'], 'সদস্যের_নাম': session['নাম'], 'সদস্যের_ফোন': session['ফোন']||''
        }});
        toast('বাচ্চা যুক্ত হয়েছে'); withRefreshThen(()=>renderTab());
      }catch(e){ msg.textContent=e.message; msg.className='status-msg err'; }
    });

    const babyListEl = row.querySelector('[data-act="babyList"]');
    if(babyListEl){
      activeBabies.forEach(baby=>{
        const bCard = document.createElement('div');
        bCard.style.cssText = 'padding:8px 0;border-top:1px dashed var(--rule);';
        const bUpdates = cache.babyUpdate.filter(u=>String(u['বাচ্চা_ID'])===String(baby['ID']))
          .sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
        const bPhotos = String(baby['ছবি_লিংক']||'').split(',').map(s=>s.trim()).filter(Boolean);
        const custodians = cache.custodians;
        bCard.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="li-meta"><b>বাচ্চা #${baby['ক্রম']}</b> · ${baby['লিঙ্গ']||'অজানা'}</div>
          </div>
          ${bPhotos.length? `<div class="row-actions">${bPhotos.map(p=>`<img src="${p}" alt="বাচ্চার ছবি" data-proof-url="${p}" style="max-width:60px;max-height:60px;border-radius:7px;cursor:pointer;object-fit:cover;border:1px solid var(--rule);">`).join('')}</div>`:''}
          ${baby['নোট']?`<div style="font-size:12.5px;margin-top:3px;">${baby['নোট']}</div>`:''}
          <div class="row-actions" style="margin-top:4px;">
            <button class="btn small ghost" data-act="babyNoteToggle">তথ্য/ছবি যুক্ত করুন</button>
            ${canManage? `<button class="btn small ghost" data-act="babyGiveToggle">আদালকে দিন</button>`:''}
            ${canManage? `<button class="btn small ghost" data-act="babySellToggle">বিক্রি করুন</button>`:''}
          </div>
          <div data-act="babyNoteForm" style="display:none;margin-top:6px;">
            <input type="file" accept="image/*" multiple data-act="babyNoteFile">
            <input type="text" data-act="babyNoteText" placeholder="নোট লিখুন" style="margin-top:4px;">
            <button class="btn small gold" data-act="babyNoteSubmit" style="margin-top:6px;">সাবমিট করুন</button>
            <div class="status-msg" data-act="babyNoteMsg"></div>
          </div>
          ${canManage? `
          <div data-act="babyGiveForm" style="display:none;margin-top:6px;">
            <label>আদাল বাছাই করুন</label>
            <select data-act="babyCustSelect">
              <option value="">-- বাছাই করুন --</option>
              ${custodians.map(c=>`<option value="${c['ID']}">${c['নাম']}${c['ফোন']?' · '+c['ফোন']:''}</option>`).join('')}
              <option value="__new__">+ নতুন আদাল</option>
            </select>
            <div data-act="babyNewCustWrap" style="display:none;margin-top:6px;">
              <label>আদালের নাম</label><input type="text" data-act="babyNewCustName">
              <label>ফোন</label><input type="tel" data-act="babyNewCustPhone">
              <label>ঠিকানা</label><input type="text" data-act="babyNewCustAddr">
            </div>
            <button class="btn small gold" data-act="babyGiveSubmit" style="margin-top:6px;">নিশ্চিত করুন</button>
            <div class="status-msg" data-act="babyGiveMsg"></div>
          </div>` : ''}
          ${canManage? `
          <div data-act="babySellForm" style="display:none;margin-top:6px;">
            <label>বিক্রয়মূল্য (৳)</label>
            <input type="number" data-act="babySellAmt" value="0">
            <button class="btn small gold" data-act="babySellSubmit" style="margin-top:6px;">বিক্রি নিশ্চিত করুন</button>
            <div class="status-msg" data-act="babySellMsg"></div>
          </div>` : ''}
          <div data-act="babyUpdHistory" style="margin-top:4px;">
            ${bUpdates.map(u=>{
              const uPhotos = String(u['ছবি_লিংক']||'').split(',').map(s=>s.trim()).filter(Boolean);
              return `<div style="padding:4px 0;border-top:1px dashed var(--rule);">
                <div class="li-meta">${u['সদস্যের_নাম']||''} · ${fmtDate(u['তারিখ'])}</div>
                ${u['নোট']?`<div style="font-size:12.5px;margin-top:2px;">${u['নোট']}</div>`:''}
                ${uPhotos.length? `<div class="row-actions">${uPhotos.map(p=>`<img src="${p}" alt="ছবি" data-proof-url="${p}" style="max-width:55px;max-height:55px;border-radius:6px;cursor:pointer;object-fit:cover;border:1px solid var(--rule);">`).join('')}</div>`:''}
              </div>`;
            }).join('')}
          </div>`;

        bCard.querySelectorAll('[data-proof-url]').forEach(img=>{
          img.addEventListener('click', (ev)=>{ ev.stopPropagation(); window.open(img.getAttribute('data-proof-url'),'_blank'); });
        });

        // --- তথ্য/ছবি যুক্ত করুন (যে কেউ পারবে) ---
        const noteToggle = bCard.querySelector('[data-act="babyNoteToggle"]');
        const noteForm = bCard.querySelector('[data-act="babyNoteForm"]');
        noteToggle.addEventListener('click', ()=>{ noteForm.style.display = noteForm.style.display==='none' ? '' : 'none'; });
        bCard.querySelector('[data-act="babyNoteSubmit"]').addEventListener('click', async ()=>{
          const noteFile = bCard.querySelector('[data-act="babyNoteFile"]');
          const noteText = bCard.querySelector('[data-act="babyNoteText"]').value.trim();
          const noteMsg = bCard.querySelector('[data-act="babyNoteMsg"]');
          if(!noteText && noteFile.files.length===0){ noteMsg.textContent='অন্তত একটা নোট বা ছবি দিন'; noteMsg.className='status-msg err'; return; }
          try{
            const urls = await uploadMultiplePhotos_(noteFile.files, 'baby_'+baby['ID'], noteMsg);
            await apiPost('add', {sheet:'বাচ্চা_আপডেট', data:{
              'বাচ্চা_ID': baby['ID'], 'ছবি_লিংক': urls.join(','), 'নোট': noteText,
              'সদস্য_ID': session['ID'], 'সদস্যের_নাম': session['নাম'], 'সদস্যের_ফোন': session['ফোন']||''
            }});
            toast('তথ্য যোগ হয়েছে'); withRefreshThen(()=>renderTab());
          }catch(e){ noteMsg.textContent=e.message; noteMsg.className='status-msg err'; }
        });

        // --- আদালকে দিন (শুধু ম্যানেজার/ফিল্ড পরিচালক) ---
        const giveToggle = bCard.querySelector('[data-act="babyGiveToggle"]');
        const giveForm = bCard.querySelector('[data-act="babyGiveForm"]');
        if(giveToggle) giveToggle.addEventListener('click', ()=>{ giveForm.style.display = giveForm.style.display==='none' ? '' : 'none'; });
        const custSelect = bCard.querySelector('[data-act="babyCustSelect"]');
        const newCustWrap = bCard.querySelector('[data-act="babyNewCustWrap"]');
        if(custSelect) custSelect.addEventListener('change', ()=>{
          newCustWrap.style.display = custSelect.value==='__new__' ? '' : 'none';
        });
        const giveSubmitBtn = bCard.querySelector('[data-act="babyGiveSubmit"]');

        }});
        toast('কিস্তি জমা হয়েছে'); withRefreshThen(()=>renderTab());
      }catch(e){ instMsg.textContent=e.message; instMsg.className='status-msg err'; }

    });

      showDistributionModal_(iv);
    });
    const distBtn = row.querySelector('[data-act="distributeDividend"]');
    if(distBtn){

          await apiPost('distributeDividend', {id: iv['ID']});

      });
    }
    const updFile = row.querySelector('[data-act="updFile"]');

    updFile.addEventListener('change', ()=>{
      updPreview.innerHTML = '';
      Array.from(updFile.files).forEach(f=>{
        const reader = new FileReader();
        reader.onload = e=>{
          const img = document.createElement('img');
          img.src = e.target.result;
          img.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--rule);';

        const urls = await uploadMultiplePhotos_(updFile.files, (iv['শিরোনাম']||'update'), updMsg);
        await apiPost('add', {sheet:'ইনভেস্টমেন্ট_আপডেট', data:{
          'ইনভেস্টমেন্ট_ID':iv['ID'],'ছবি_লিংক':urls.join(','),'নোট':note,
          'সদস্য_ID':session['ID'],'সদস্যের_নাম':session['নাম'],'সদস্যের_ফোন':session['ফোন']||''
        }});
        toast('তথ্য যোগ হয়েছে'); withRefreshThen(()=>renderTab());
      }catch(e){ updMsg.textContent=e.message; updMsg.className='status-msg err'; }
    });

    el.appendChild(row);

  // "লাভ/ক্ষতি" বিস্তারিত পেজ থেকে কোনো নির্দিষ্ট ইনভেস্টমেন্টে ক্লিক করে এলে
  // সেই এন্ট্রিটার বিস্তারিত অংশ সাথে সাথেই খুলে দিয়ে সেখানে স্ক্রল করে দেখানো হয়
  if(focusInvestId){
    const targetRow = el.querySelector(`[data-invest-id="${focusInvestId}"]`);
    if(targetRow){
      const head = targetRow.querySelector('[data-act="toggleHead"]');
      if(head) head.click();
      targetRow.scrollIntoView({behavior:'smooth', block:'start'});
      targetRow.style.transition = 'background-color .3s';
      targetRow.style.backgroundColor = 'var(--brass-soft)';
      setTimeout(()=>{ targetRow.style.backgroundColor = ''; }, 1600);
    }
    focusInvestId = null;
  }
}

/* একাধিক ছবি ফাইল একে একে Drive-এ আপলোড করে URL-এর তালিকা রিটার্ন করে */
async function uploadMultiplePhotos_(fileList, namePrefix, msgEl){
  const files = Array.from(fileList || []);
  const urls = [];
  for(let i=0;i<files.length;i++){
    if(msgEl){ msgEl.textContent = `ছবি আপলোড হচ্ছে (${i+1}/${files.length})...`; msgEl.className='status-msg'; }
    const dataUrl = await resizeImageToDataUrl_(files[i]);
    const base64 = dataUrl.split(',')[1];
    const uploadRes = await apiPost('uploadImage', {data:{base64, mimeType:'image/jpeg', filename:namePrefix+'_'+(i+1)+'.jpg'}});
    if(uploadRes.data && uploadRes.data.url) urls.push(uploadRes.data.url);
  }
  return urls;
}

/* ---------------- বাকিতে পণ্য বিক্রয় (মুরাবাহা পদ্ধতি) ----------------
   সমিতি একটা পণ্য ক্রয় করে গ্রামের মানুষের কাছে অগ্রিম-ঘোষিত লাভে বিক্রি করে,
   আর সেই বিক্রয়মূল্যটা কয়েক কিস্তিতে আদায় করা হয়। কোনো সুদ নেই — শুধু
   ক্রয়মূল্যের সাথে সুনির্দিষ্ট লাভ যোগ করে একটাই নির্দিষ্ট মোট মূল্য ঠিক হয়,
   যা শুরুতেই গ্রাহককে জানিয়ে দেওয়া হয় (তাই ইসলামিক শরিয়া মোতাবেক হালাল)। */

/* ---------------- POLLS ---------------- */
function renderPoll(main, role){
  const isManager = role===ROLES.MANAGER;
  const polls = [...cache.poll].sort((a,b)=>String(b['তারিখ']).localeCompare(String(a['তারিখ'])));
  main.innerHTML = `
    ${isManager? `
    <div class="card">
      <h2>নতুন ভোট চালু করুন</h2>
      <label>প্রশ্ন</label>
      <input type="text" id="pQ" placeholder="চলতি মাসে ২টি গরু কেনা হবে কি?">
      <label>অপশনসমূহ (কমা দিয়ে আলাদা করুন)</label>
      <input type="text" id="pOpts" placeholder="হ্যাঁ, না">
      <button class="btn full gold" id="addPollBtn">ভোট চালু করুন</button>
      <div class="status-msg" id="pMsg"></div>
    </div>` : ''}
    <div class="card"><h2>ভোটসমূহ</h2>
      <div id="pollList">${polls.length? '' : '<div class="empty">কোনো ভোট নেই</div>'}</div>
    </div>`;
  if(isManager){
    document.getElementById('addPollBtn').addEventListener('click', async ()=>{
      const q = document.getElementById('pQ').value.trim();
      const opts = document.getElementById('pOpts').value.trim();
      const msg = document.getElementById('pMsg');
      if(!q || !opts){ msg.textContent='প্রশ্ন ও অপশন দিন'; msg.className='status-msg err'; return; }
      try{
        await apiPost('add', {sheet:'ভোট', data:{'প্রশ্ন':q,'অপশন':opts,'প্রকাশক':session['নাম'],'স্ট্যাটাস':'চলমান'}});
        toast('ভোট চালু হয়েছে'); withRefreshThen(()=>renderTab());
      }catch(e){ msg.textContent=e.message; msg.className='status-msg err'; }
    });
  }
  const el = document.getElementById('pollList');
  polls.forEach(p=>{
    const options = String(p['অপশন']||'').split(',').map(s=>s.trim()).filter(Boolean);
    const votes = cache.votes.filter(v=>String(v['ভোট_ID'])===String(p['ID']));
    const myVote = votes.find(v=>String(v['সদস্য_ID'])===String(session['ID']));
    const total = votes.length || 1;
    const card = document.createElement('div'); card.className='list-item';
    card.innerHTML = `
      <div class="li-top">
        <div class="li-name">${p['প্রশ্ন']}</div>
        <span class="badge ${p['স্ট্যাটাস']==='চলমান'?'running':'closed'}">${p['স্ট্যাটাস']}</span>
      </div>
      <div class="li-meta">প্রকাশক: ${p['প্রকাশক']||''} · ${fmtDate(p['তারিখ'])}</div>
      <div class="poll-options" data-opts></div>
      ${isManager && p['স্ট্যাটাস']==='চলমান'? `<div class="row-actions"><button class="btn small danger" data-act="close">ভোট বন্ধ করুন</button></div>`:''}`;
    const optsWrap = card.querySelector('[data-opts]');
    const showResults = !!myVote || p['স্ট্যাটাস']!=='চলমান';
    options.forEach(opt=>{
      const count = votes.filter(v=>v['বাছাই']===opt).length;
      const pct = Math.round((count/total)*100);
      const div = document.createElement('div'); div.className='poll-opt';
      if(showResults){
        div.innerHTML = `<span>${opt} ${myVote && myVote['বাছাই']===opt?'✓':''}</span><span>${count} ভোট (${pct}%)</span>`;
      } else {
        div.innerHTML = `<span>${opt}</span>`;
        div.style.cursor='pointer';
        div.addEventListener('click', async ()=>{
          try{ await apiPost('vote', {data:{'ভোট_ID':p['ID'],'সদস্য_ID':session['ID'],'বাছাই':opt}}); toast('ভোট গৃহীত হয়েছে'); withRefreshThen(()=>renderTab()); }
          catch(e){ toast(e.message); }
        });
      }
      optsWrap.appendChild(div);
    });
    const closeBtn = card.querySelector('[data-act="close"]');
    if(closeBtn) closeBtn.addEventListener('click', async ()=>{
      try{ await apiPost('closePoll', {id:p['ID']}); toast('ভোট বন্ধ হয়েছে'); withRefreshThen(()=>renderTab()); }
      catch(e){ toast(e.message); }
    });
    el.appendChild(card);
  });
}
